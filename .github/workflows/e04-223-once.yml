name: A14 E04 #223 one-shot verified source integration
run-name: "E04 #223 7-file SHA256 recovery to review branch"
on:
  push:
    branches: [repair/a14-e04-223-integration-20261102]
permissions:
  contents: write
  actions: read
concurrency:
  group: e04-223-one-shot-review-integration
  cancel-in-progress: false
jobs:
  recover-and-test:
    if: >-
      github.repository == 'trung-via/ai-commerce' &&
      github.ref_name == 'repair/a14-e04-223-integration-20261102' &&
      github.event.head_commit.message == 'ci: one-shot verified A14 E04 #223 recovery integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact review branch (never main)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Download ONLY the fixed successful HostOps2 #228 source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 41426161990
          repository: trung-via/ai-commerce
          name: hostops-v2-ef02-223-source-41426161990
          path: .local/e04
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable archive and integrate exact E04 bytes
        run: python scripts/e04_223_one_shot_integration.py
      - name: Install project test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify E04, L04 and affected source/claim consumers
        run: >-
          python -m pytest
          tests/test_a14_commerce_e2e.py
          tests/test_a14_attribution.py
          tests/test_a12_snapshot.py
          tests/test_a13_claim_rights.py
          tests/test_minimum_test.py
          tests/test_ef02_mt01_registry.py
          -q -n 4 --dist loadfile
      - name: Commit verified changes to review branch ONLY
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "repair/a14-e04-223-integration-20261102"
          git rm -f -- scripts/e04_223_one_shot_integration.py .github/workflows/e04-223-once.yml
          git add -- contracts/AffiliateCommerceRun.v1.schema.json
          git add -- docs/engineering/A14_E04_IMPLEMENTATION_REPORT.md
          git add -- src/ai_commerce/affiliate_commerce/
          git add -- tests/test_a14_commerce_e2e.py
          git add -- src/ai_commerce/engineering/minimum_test.py
          git add -- .github/ef02/verify-profiles.json
          git diff --cached --check
          git -c user.name="AI Commerce Review Integration" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "recover(A14 E04 #223): integrate 7 SHA256-verified files and scoped MT-01 mapping"
          git push origin HEAD:refs/heads/repair/a14-e04-223-integration-20261102
