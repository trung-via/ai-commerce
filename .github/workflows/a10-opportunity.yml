name: A10 offline opportunity and creative acceptance

on:
  pull_request:
    paths:
      - "src/ai_commerce/opportunity/**"
      - "src/ai_commerce/cli.py"
      - "contracts/Opportunity*.schema.json"
      - "contracts/Trend*.schema.json"
      - "contracts/Signal*.schema.json"
      - "contracts/AudienceInsight.v1.schema.json"
      - "tests/test_a10*.py"
      - "scripts/a10_demo.py"
      - ".github/workflows/a10-opportunity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFMPEG_INSTALL_FAILED" }
      - name: Verify required media tools
        run: python -c "import shutil,subprocess; assert shutil.which('ffmpeg') and shutil.which('ffprobe'); assert b'libx264' in subprocess.check_output(['ffmpeg','-hide_banner','-encoders'])"
      - name: Install project and pytest-xdist
        run: python -m pip install -e ".[dev]" Pillow
      - name: Full A01-A10 regression suite (12 workers)
        run: python -m pytest tests -q -n 12
      - name: M02 component-local trend suite (12 workers)
        run: python -m pytest src/ai_commerce/opportunity/trends/tests/test_m02.py -q -n 12
      - name: Run synthetic A10 offline end-to-end demo
        run: python scripts/a10_demo.py --output .local/a10-ci-first
      - name: Verify deterministic replay against retained source
        run: python scripts/a10_demo.py --replay-from .local/a10-ci-first --output .local/a10-ci-replay
