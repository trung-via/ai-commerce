name: AI Commerce HostOps v2 signed and scoped host operations
run-name: "HostOpsV2 Issue #${{ github.event.issue.number }}"

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ai-commerce-hostops-v2
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.repository.private == true &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[HOSTOPS2] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Confirm live repository private
        id: privacy
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.get({owner: context.repo.owner, repo: context.repo.repo});
            if (!data.private || data.full_name.toLowerCase() !== 'trung-via/ai-commerce') {
              core.setFailed('HOSTOPS_REPOSITORY_NOT_PRIVATE');
              return;
            }
            core.setOutput('private', 'true');
      - name: Capture immutable Issue-opened payload
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            if (!issue || issue.user?.login !== context.repo.owner ||
                !issue.title.startsWith('[HOSTOPS2] ') || !issue.body) {
              core.setFailed('HOSTOPS_NOT_OWNER_AUTHORIZED');
              return;
            }
            fs.writeFileSync('hostops-v2-request.json', issue.body, {encoding:'utf8', flag:'wx'});
      - name: Validate closed request contract
        shell: bash
        env:
          HOSTOPS_ISSUER: ${{ github.event.issue.user.login }}
          HOSTOPS_OWNER: ${{ github.repository_owner }}
          HOSTOPS_PRIVATE: ${{ steps.privacy.outputs.private }}
        run: |
          python scripts/hostops_v2.py validate \
            --request-file hostops-v2-request.json \
            --repository "$GITHUB_REPOSITORY" \
            --issuer "$HOSTOPS_ISSUER" --owner "$HOSTOPS_OWNER" \
            --source-sha "$GITHUB_SHA" --is-private "$HOSTOPS_PRIVATE" \
            --output hostops-v2-validated.json
      - name: Export immutable payload
        uses: actions/upload-artifact@v4
        with:
          name: hostops-v2-request-${{ github.run_id }}
          path: |
            hostops-v2-request.json
            hostops-v2-validated.json
          retention-days: 7

  execute:
    needs: validate
    if: needs.validate.result == 'success' && github.event.repository.private == true
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: hostops-v2-request-${{ github.run_id }}
          path: .local/hostops-v2-input
      - name: Recheck live private visibility on Windows
        id: privacy
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.get({owner: context.repo.owner, repo: context.repo.repo});
            if (!data.private || data.full_name.toLowerCase() !== 'trung-via/ai-commerce') {
              core.setFailed('HOSTOPS_REPOSITORY_NOT_PRIVATE');
              return;
            }
            core.setOutput('private', 'true');
      - name: Revalidate approved scope and run bounded operation
        shell: pwsh
        env:
          HOSTOPS_ISSUER: ${{ github.event.issue.user.login }}
          HOSTOPS_OWNER: ${{ github.repository_owner }}
          HOSTOPS_PRIVATE: ${{ steps.privacy.outputs.private }}
          HOSTOPS_APPROVED_ROOT: ${{ vars.HOSTOPS_APPROVED_WORKSPACE_ROOT }}
        run: |
          python scripts/hostops_v2.py execute --request-file .local/hostops-v2-input/hostops-v2-request.json --repository "$env:GITHUB_REPOSITORY" --issuer "$env:HOSTOPS_ISSUER" --owner "$env:HOSTOPS_OWNER" --source-sha "$env:GITHUB_SHA" --is-private "$env:HOSTOPS_PRIVATE" --approved-root "$env:HOSTOPS_APPROVED_ROOT" --output .local/hostops-v2-result.json
          exit $LASTEXITCODE
      - name: Preserve result including blocked diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostops-v2-result-${{ github.run_id }}
          path: .local/hostops-v2-result.json
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: [validate, execute]
    if: >-
      always() && github.event.repository.private == true &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[HOSTOPS2] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download bounded evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hostops-v2-result-${{ github.run_id }}
          path: hostops-report
      - name: Download validation evidence on preflight failure
        if: needs.validate.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hostops-v2-request-${{ github.run_id }}
          path: hostops-validation
      - name: Post sanitized result to original Issue
        uses: actions/github-script@v7
        env:
          HOSTOPS_ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const fs = require('fs');
            let summary = 'BLOCKED / NO_VERIFIABLE_RESULT';
            const candidates = ['hostops-report/hostops-v2-result.json', 'hostops-validation/hostops-v2-validated.json'];
            const path = candidates.find(p => fs.existsSync(p));
            if (path) {
              try {
                const d=JSON.parse(fs.readFileSync(path,'utf8'));
                const allowed=new Set(['host_inventory_read','d5_deep_read','scratch_marker_write','workspace_file_write']);
                const codes=new Set(['HUMAN_KEY_NOT_ENROLLED','HUMAN_SIGNATURE_INVALID',
                  'APPROVED_ROOT_NOT_CONFIGURED','PRIVATE_REPO_REQUIRED','OWNER_REQUIRED',
                  'BAD_SHAPE','BAD_PARAMETERS','WRITE_FAILED','ALREADY_EXISTS_NO_OVERWRITE',
                  'BAD_JSON','BAD_SHA','BAD_INPUT_LENGTH','DUPLICATE_KEY','IDENTITY_MISMATCH',
                  'BAD_REQUEST_ID','OPERATION_NOT_ALLOWED','READ_PARAMETERS_NOT_ALLOWED',
                  'BAD_MARKER','BAD_WRITE_SHAPE','BAD_RELATIVE_PATH',
                  'UNSUPPORTED_FILE_EXTENSION','BAD_WRITE_CONTENT','HUMAN_SIGNATURE_REQUIRED',
                  'BAD_SIGNATURE_ENCODING','BAD_SIGNATURE_FORMAT','APPROVED_ROOT_INVALID',
                  'SYMLINK_DENIED','NON_DIRECTORY_PATH','ROOT_NOT_SAFE',
                  'SIGNATURE_VERIFIER_UNAVAILABLE','DIAGNOSTIC_FAILED','DIAGNOSTIC_OUTPUT_INVALID']);
                if(d.schema==='ai-commerce-hostops-result-v2') {
                  if(d.status==='BLOCKED' && codes.has(d.error_code)) {
                    summary='BLOCKED / '+d.error_code;
                  } else if (allowed.has(d.operation) && d.status==='WRITTEN' &&
                    /^[0-9a-f]{64}$/.test(d.sha256) &&
                    ['job_scratch_only','human_approved_workspace'].includes(d.scope)) {
                    summary='WRITTEN / '+d.operation+' / sha256='+d.sha256+' / scope='+d.scope;
                  } else if(allowed.has(d.operation) && d.status==='OBSERVED' && d.diagnostics) {
                    const x=d.diagnostics;
                    const fields=['session_id','pwsh_major','chrome_count','runner_count',
                      'cdp_9333_count','cdp_9222_count','d5_debug_flag_count','d5_profile_flag_count'];
                    if(x.operation===d.operation && fields.every(k=>Number.isInteger(x[k])&&x[k]>=0&&x[k]<=10000) &&
                      typeof x.tcp_known==='boolean'&&typeof x.process_flags_known==='boolean' &&
                      ['Running','Ready','Disabled','Other','Unknown'].includes(x.task_state)) {
                      summary='OBSERVED / '+d.operation+' / '+fields.map(k=>k+'='+x[k]).join(' / ')+
                        ' / tcp_known='+x.tcp_known+' / process_flags_known='+x.process_flags_known+
                        ' / task_state='+x.task_state;
                    }
                  }
                }
              } catch(e) {}
            }
            const url=process.env.GITHUB_SERVER_URL+'/'+context.repo.owner+'/'+context.repo.repo+
              '/actions/runs/'+context.runId;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,
              issue_number:Number(process.env.HOSTOPS_ISSUE_NUMBER),
              body:'HOSTOPS_V2_RESULT\n'+summary+'\nRun: '+url+
              '\nNo Wake, browser Send, arbitrary shell or changes outside approved scope.'});
