name: AI Commerce Issue ingress (EF02 / HostOps Personal)
run-name: "${{ github.event.issue.title }} (#${{ github.event.issue.number }}, ${{ github.event.action }})"
# Personal HostOps remains active; D5 carrier below is OFF by default.
# D5 cannot run without an explicit protected variable and separately signed private enrollment.
# Legacy HostOps v1/v2/v3 reusable workflows were retired; EF02 remains unchanged.
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  ef02:
    if: >-
      startsWith(github.event.issue.title, '[EF02]') &&
      (github.event.action == 'opened' || github.event.action == 'labeled')
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/ef02-batch.yml

  hostops-personal:
    if: >-
      github.event.repository.full_name == 'trung-via/ai-commerce' &&
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issues' &&
         github.event.action == 'opened' &&
         github.event.issue.user.login == github.repository_owner &&
         startsWith(github.event.issue.title, '[HOSTOPS READ] ')) ||
        (github.event_name == 'issue_comment' &&
         github.event.action == 'created' &&
         github.event.issue.user.login == github.repository_owner &&
         github.event.comment.user.login == github.repository_owner &&
         startsWith(github.event.issue.title, '[HOSTOPS WRITE] ') &&
         github.event.comment.body == format('APPROVE WRITE #{0}', github.event.issue.number))
      )
    # Dedicated operator-interactive instance; EF02 uses only ai-commerce-ef02.
    runs-on: [self-hosted, Windows, ai-commerce-hostops]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: personal-hostops-workspace
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Execute fixed bounded personal operation
        shell: pwsh
        env:
          HOSTOPS_PERSONAL_MODE: ${{ github.event_name == 'issues' && 'read' || 'write' }}
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE "src"
          python -m ai_commerce.hostops_v3.personal --mode "$env:HOSTOPS_PERSONAL_MODE" --output "$env:RUNNER_TEMP\personal-hostops-result.json"
          exit $LASTEXITCODE
      - name: Post sanitized result to same Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const file = path.join(process.env.RUNNER_TEMP, 'personal-hostops-result.json');
            let record = {status:'BLOCKED',code:'NO_NATIVE_RECEIPT'};
            let rawNativeText = null;
            if (fs.existsSync(file)) {
              try {
                rawNativeText = fs.readFileSync(file,'utf8');
                record = JSON.parse(rawNativeText);
                if (record === null || typeof record !== 'object' || Array.isArray(record))
                  throw new Error('INVALID_RECEIPT_TYPE');
              } catch (_) {
                record = {status:'BLOCKED',code:'INVALID_NATIVE_RECEIPT'};
                rawNativeText = null;
              }
            }
            const publicFields = ['status','code','operation','issue_number','root_id','relative_path','bytes','sha256','windows','architecture','logical_cpu_count','no_shell_command_executed','overwritten','remote_shell_enabled','source_sha','approval_channel','content_utf8','git_head_sha','branch','tracked_changes','prefix','paths','total_tracked_in_scope','truncated','git_before_sha','git_after_sha','target_sha','fast_forward_only','sync_result','all_listener_count','unmatched_listener_count','arbitrary_shell_enabled','cdp_port','listener_count','loopback_count','unexpected_binding_count','chrome_owned_loopback_count','same_session_chrome_count','devtools_protocol_ok','infrastructure_ready','exact_chat_verified','wake_sent','diagnostics'];
            const sanitized = {};
            for (const key of publicFields) {
              if (Object.prototype.hasOwnProperty.call(record,key)) sanitized[key] = record[key];
            }
            // Other legacy operations must never inherit the new nested field.
            if (record.operation !== 'standing_read_diagnostics') delete sanitized.diagnostics;
            if (typeof sanitized.content_utf8 === 'string' && sanitized.content_utf8.length > 8192)
              delete sanitized.content_utf8;
            // Strict field-level allowlist for public runner diagnostics.
            // NEVER publish raw CIM ExecutablePath, CommandLine, account or task args.
            if (record.operation === 'runner_runtime_inventory') {
              const names = ['AI-COMMERCE-EF02-01','AI-COMMERCE-EF02-02','AI-COMMERCE-HOSTOPS-01'];
              const safe = Array.isArray(record.runners) && record.runners.length === 3
                ? record.runners.map((row, i) => ({
                    name: names[i],
                    task_state: row?.task_state,
                    task_interactive: row?.task_interactive,
                    hidden_launcher_configured: row?.hidden_launcher_configured,
                    hidden_launcher_process_count: row?.hidden_launcher_process_count,
                    listener_process_count: row?.listener_process_count,
                    listener_session_ids: row?.listener_session_ids,
                  }))
                : [];
              const valid = safe.length === 3 && safe.every((row, i) =>
                record.runners[i]?.name === names[i] &&
                ['Running','Ready','Disabled','Queued','NOT_REGISTERED'].includes(row.task_state) &&
                typeof row.task_interactive === 'boolean' &&
                typeof row.hidden_launcher_configured === 'boolean' &&
                Number.isInteger(row.hidden_launcher_process_count) &&
                row.hidden_launcher_process_count >= 0 && row.hidden_launcher_process_count <= 10 &&
                Number.isInteger(row.listener_process_count) &&
                row.listener_process_count >= 0 && row.listener_process_count <= 10 &&
                Array.isArray(row.listener_session_ids) &&
                row.listener_session_ids.every(x => Number.isInteger(x) && x >= 0 && x < 100000)
              );
              if (valid &&
                  Number.isInteger(sanitized.all_listener_count) &&
                  Number.isInteger(sanitized.unmatched_listener_count) &&
                  sanitized.all_listener_count >= 0 &&
                  sanitized.unmatched_listener_count >= 0 &&
                  sanitized.unmatched_listener_count <= sanitized.all_listener_count) {
                sanitized.runners = safe;
              } else {
                sanitized.status = 'BLOCKED';
                sanitized.code = 'INVALID_PUBLIC_RUNNER_RECEIPT';
                delete sanitized.all_listener_count;
                delete sanitized.unmatched_listener_count;
              }
            }
            if (record.operation === 'cdp_9333_status') {
              const counts = ['listener_count','loopback_count','unexpected_binding_count',
                'chrome_owned_loopback_count','same_session_chrome_count'];
              const valid = sanitized.status === 'OBSERVED' &&
                sanitized.cdp_port === 9333 &&
                counts.every(k => Number.isInteger(sanitized[k]) &&
                  sanitized[k] >= 0 && sanitized[k] <= 16) &&
                sanitized.loopback_count + sanitized.unexpected_binding_count === sanitized.listener_count &&
                sanitized.same_session_chrome_count <= sanitized.chrome_owned_loopback_count &&
                sanitized.chrome_owned_loopback_count <= sanitized.loopback_count &&
                typeof sanitized.devtools_protocol_ok === 'boolean' &&
                typeof sanitized.infrastructure_ready === 'boolean' &&
                sanitized.exact_chat_verified === false &&
                sanitized.wake_sent === false &&
                sanitized.arbitrary_shell_enabled === false;
              if (!valid) {
                sanitized.status = 'BLOCKED';
                sanitized.code = 'INVALID_PUBLIC_CDP_RECEIPT';
                for (const k of counts) delete sanitized[k];
                for (const k of ['cdp_port','devtools_protocol_ok','infrastructure_ready',
                  'exact_chat_verified','wake_sent']) delete sanitized[k];
              }
            }
            // Protected sanitizer: independent, closed-schema validation of the
            // Human-approved standing READ. This catalogue mirrors the pinned
            // source vocabulary; never derive it from Issue/body/native JSON.
            const standingCatalog = [["chrome_profile",["UNVERIFIED","DEDICATED_DIR_PRESENT","UNAVAILABLE"]],["chrome_config",["UNAVAILABLE","KNOWN_CANDIDATES_ABSENT","KNOWN_CANDIDATES_AMBIGUOUS","KNOWN_CONFIG_NOT_VERIFIED","KNOWN_CONFIG_EXACT_9333","KNOWN_CONFIG_OTHER_PORT"]],["chrome_markers",["UNVERIFIED","LOCK_MARKER_PRESENT","LOCK_MARKERS_ABSENT","UNAVAILABLE"]],["cdp_9333_listener",["ABSENT","EXACT_LOOPBACK","UNSAFE_BINDING","UNAVAILABLE"]],["chrome_process",["MATCHED","UNVERIFIED","UNAVAILABLE"]],["chrome_session",["MATCHED","UNVERIFIED","UNAVAILABLE"]],["cdp_protocol",["RESPONDING","UNVERIFIED","UNAVAILABLE"]],["ef02_01_task",["RUNNING","READY","DISABLED","QUEUED","NOT_REGISTERED","UNAVAILABLE"]],["ef02_01_listener",["PRESENT","ABSENT","UNAVAILABLE"]],["ef02_02_task",["RUNNING","READY","DISABLED","QUEUED","NOT_REGISTERED","UNAVAILABLE"]],["ef02_02_listener",["PRESENT","ABSENT","UNAVAILABLE"]],["hostops_01_task",["RUNNING","READY","DISABLED","QUEUED","NOT_REGISTERED","UNAVAILABLE"]],["hostops_01_listener",["PRESENT","ABSENT","UNAVAILABLE"]],["repo_git",["CLEAN","TRACKED_CHANGES","UNAVAILABLE"]],["python_runtime",["SUPPORTED","UNSUPPORTED"]],["d5_metadata",["UNAVAILABLE","MANIFEST_PRESENT","MANIFEST_ABSENT"]]];
            if (record.operation === 'standing_read_diagnostics') {
              const expectedKeys = new Set([
                'status','operation','windows','diagnostics','arbitrary_shell_enabled',
                'exact_chat_verified','wake_sent','issue_number','approval_channel',
                'remote_shell_enabled','source_sha',
              ]);
              const keys = Object.keys(record);
              const rows = record.diagnostics;
              const isCanonical = typeof rawNativeText === 'string' &&
                rawNativeText.trim() === JSON.stringify(record);
              const valid = isCanonical &&
                Buffer.byteLength(rawNativeText,'utf8') <= 8192 &&
                keys.length === expectedKeys.size &&
                keys.every(key => expectedKeys.has(key)) &&
                record.status === 'OBSERVED' && record.windows === true &&
                record.operation === 'standing_read_diagnostics' &&
                record.arbitrary_shell_enabled === false &&
                record.exact_chat_verified === false &&
                record.wake_sent === false &&
                record.remote_shell_enabled === false &&
                record.approval_channel === 'CHATGPT_TO_AI_COMMERCE_ISSUE' &&
                record.issue_number === context.issue.number &&
                typeof record.source_sha === 'string' &&
                /^[0-9a-f]{40}$/.test(record.source_sha) &&
                record.source_sha === context.sha &&
                Array.isArray(rows) && rows.length === standingCatalog.length &&
                rows.every((row, index) =>
                  row !== null && typeof row === 'object' && !Array.isArray(row) &&
                  Object.keys(row).length === 2 &&
                  Object.prototype.hasOwnProperty.call(row,'category') &&
                  Object.prototype.hasOwnProperty.call(row,'code') &&
                  row.category === standingCatalog[index][0] &&
                  typeof row.code === 'string' &&
                  standingCatalog[index][1].includes(row.code)
                );
              // Never publish the generic projection if validation fails:
              // even allowed legacy field names can carry untrusted values.
              for (const key of Object.keys(sanitized)) delete sanitized[key];
              if (!valid) {
                Object.assign(sanitized, {
                  status:'BLOCKED', operation:'standing_read_diagnostics',
                  code:'INVALID_PUBLIC_DIAGNOSTIC_RECEIPT'
                });
              } else {
                Object.assign(sanitized, {
                  status:'OBSERVED',operation:'standing_read_diagnostics',
                  issue_number:context.issue.number,
                  windows:true, diagnostics:rows.map(row => ({
                    category:row.category, code:row.code
                  })),
                  arbitrary_shell_enabled:false,
                  exact_chat_verified:false, wake_sent:false,
                  remote_shell_enabled:false,
                  approval_channel:'CHATGPT_TO_AI_COMMERCE_ISSUE',
                  source_sha:record.source_sha
                });
              }
            }
            const result = 'AI_COMMERCE_PERSONAL_HOSTOPS_RESULT_V1\n' + JSON.stringify(sanitized);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: result,
            });

  hostops-d5-carrier:
    if: >-
      vars.HOSTOPS_D5_PROTECTED_ENABLE == 'REVIEWED' &&
      github.repository == 'trung-via/ai-commerce' &&
      github.actor == github.repository_owner &&
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[HOSTOPS D5] ')
    runs-on: [self-hosted, Windows, ai-commerce-hostops]
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    concurrency:
      group: d5-signed-carrier
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Materialize and relay fixed signed envelope
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          $request = Join-Path $env:RUNNER_TEMP "d5-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-request.json"
          $receipt = Join-Path $env:RUNNER_TEMP "d5-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-receipt.json"
          python -B -m ai_commerce.hostops_v3.d5_control --prepare-event "$env:GITHUB_EVENT_PATH" --output "$request"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m ai_commerce.hostops_v3.d5_control --request "$request" --output "$receipt"
          exit $LASTEXITCODE
      - name: Publish independently sanitized receipt to same Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path');
            const file = path.join(process.env.RUNNER_TEMP,
              `d5-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}-receipt.json`);
            const ops = ['STATUS','MIGRATION_PREFLIGHT','RETIRE_NEW_AUTOSTART','STOP_OWNED_D5_CHROME',
              'INSTALL_VERIFIED_OLD_BEHAVIOR_LAUNCHER','START_OR_REUSE_D5_CHROME',
              'VERIFY_CDP_9333_AND_PLAYWRIGHT','INSTALL_SINGLE_LOGON_AUTOSTART',
              'REMOVE_D5_AUTOSTART','RECOVER_BOUNDED','ROLLBACK'];
            const codes = ['BLOCKED_NOT_DEPLOYED','INPUT_INVALID','SIGNATURE_INVALID','REVOKED_OR_STALE',
              'REQUEST_INVALID_OR_STALE','REQUEST_REPLAY','ENROLLMENT_REUSE_DENIED','UNKNOWN_EFFECT_HOLD',
              'PIPE_UNAVAILABLE','INVALID_PUBLIC_RECEIPT','SOURCE_DRIFT','OWNERSHIP_UNPROVEN',
              'PROFILE_ALREADY_ACTIVE_NO_CDP','RUNNER_PRESERVATION_UNPROVEN','TASK_OWNERSHIP_UNPROVEN',
              'UNSUPPORTED_SESSION','NATIVE_FAILURE_HOLD','CONFLICTING_D5_TASK','LAUNCHER_UNVERIFIED',
              'PROFILE_LOCKED','BACKUP_UNVERIFIED','LAUNCH_NOT_AUTHORIZED','PLAYWRIGHT_UNAVAILABLE',
              'CDP_PROTOCOL_UNAVAILABLE','JOURNAL_UNAVAILABLE','JOURNAL_ROTATION_REQUIRED','RECOVERY_RATE_LIMIT',
              'DRY_RUN','NOT_RUNNING','ALREADY_STOPPED','MIGRATION_READY','RETIRED','STOPPED',
              'LAUNCHER_INSTALLED','READY_ATTACH','REGISTERED','AUTOSTART_REMOVED','ROLLED_BACK_DISABLED',
              'ROOT_PROCESS_LOST','CDP_LISTENER_LOST','BROWSER_RESTARTED','BROWSER_MUST_BE_STOPPED'];
            const flags = ['effect_observed','registered','started','listener_bound','playwright_attached',
              'stable','wake_sent','login_verified','manifest_verified'];
            const allowed = new Set(['status','code','operation','request_id','source_sha','epoch',...flags]);
            let safe = {status:'BLOCKED',code:'INVALID_PUBLIC_RECEIPT',effect_observed:false};
            try {
              if (fs.statSync(file).size > 8192) throw Error();
              const raw = fs.readFileSync(file,'utf8'), r = JSON.parse(raw);
              if (!r || Array.isArray(r) || raw !== JSON.stringify(r) ||
                  Object.keys(r).some(k => !allowed.has(k)) ||
                  !['BLOCKED','OBSERVED'].includes(r.status) || !codes.includes(r.code) ||
                  (r.operation !== undefined && ![...ops,'UNKNOWN'].includes(r.operation)) ||
                  flags.some(k => r[k] !== undefined && typeof r[k] !== 'boolean') ||
                  ['wake_sent','login_verified','manifest_verified'].some(k => r[k] !== undefined && r[k] !== false)) throw Error();
              const signed = JSON.parse(context.payload.comment.body).body;
              if (r.status === 'OBSERVED' &&
                  (!ops.includes(r.operation) || r.operation !== signed.op ||
                   !/^[0-9a-f]{32}$/.test(r.request_id) || r.request_id !== signed.request_id ||
                   !/^[0-9a-f]{40}$/.test(r.source_sha) || r.source_sha !== context.sha ||
                   r.source_sha !== signed.source_sha || !Number.isInteger(r.epoch) || r.epoch < 1 ||
                   r.epoch !== signed.epoch || signed.issue_number !== context.issue.number)) throw Error();
              // Validate optional IDs even on a BLOCKED receipt before copying them.
              if ((r.request_id !== undefined && !/^[0-9a-f]{32}$/.test(r.request_id)) ||
                  (r.source_sha !== undefined && !/^[0-9a-f]{40}$/.test(r.source_sha)) ||
                  (r.epoch !== undefined && (!Number.isInteger(r.epoch) || r.epoch < 1))) throw Error();
              safe = r;
            } catch (_) {}
            await github.rest.issues.createComment({...context.repo, issue_number:context.issue.number,
              body:'AI_COMMERCE_D5_RESULT_V1\n```json\n'+JSON.stringify(safe)+'\n```'});

# Personal-mode D5 bootstrap only. This is intentionally narrower than the
  # off-host-signed D5 operator lifecycle: one owner-approved CDP activation,
  # no browser chat access, no Wake, no service or scheduled-task mutation.
  hostops-d5-personal-bootstrap:
    if: >-
      github.repository == 'trung-via/ai-commerce' &&
      github.actor == github.repository_owner &&
      github.event_name == 'issues' && github.event.action == 'opened' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[HOSTOPS D5 BOOT] ')
    runs-on: [self-hosted, Windows, ai-commerce-hostops]
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    concurrency:
      group: d5-personal-bootstrap-9333
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run fixed personally authorized Chrome 9333 acquisition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outFile = Join-Path $env:RUNNER_TEMP ('d5-personal-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.json')
          $status = 'BLOCKED'
          $code = 'PRECHECK_UNKNOWN'
          $verified = $false
          $launched = $false
          try {
            if ($env:GITHUB_ACTIONS -cne 'true' -or $env:OS -cne 'Windows_NT' -or
                $env:GITHUB_REPOSITORY -cne 'trung-via/ai-commerce') { throw 'BAD_HOST' }
            $evt = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($evt.action -cne 'opened' -or
                $evt.issue.user.login -cne 'trung-via' -or
                $evt.sender.login -cne 'trung-via' -or
                -not $evt.issue.title.StartsWith('[HOSTOPS D5 BOOT] ') -or
                [string]$evt.issue.body -cne '{"schema":"ai-commerce.d5.personal.v1","operation":"START_CDP_9333","parameters":{}}') { throw 'BAD_ISSUE' }
            if ([Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) { throw 'NO_INTERACTIVE_SESSION' }
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'ELEVATED' }
            $root = 'C:\TOOL\ai-commerce'
            $remote = (& git -C $root remote get-url origin 2>$null | Out-String).Trim()
            $branch = (& git -C $root rev-parse --abbrev-ref HEAD 2>$null | Out-String).Trim()
            $head = (& git -C $root rev-parse HEAD 2>$null | Out-String).Trim()
            $dirty = @(& git -C $root status --porcelain=v1 --untracked-files=no 2>$null)
            if ($branch -cne 'main' -or $head -cne $env:GITHUB_SHA -or
                $dirty.Count -ne 0 -or $remote -cnotin @(
                  'https://github.com/trung-via/ai-commerce.git',
                  'https://github.com/trung-via/ai-commerce',
                  'git@github.com:trung-via/ai-commerce.git')) { throw 'SOURCE_DRIFT' }
            if (-not $env:LOCALAPPDATA) { throw 'NO_APPDATA' }
            $configRoot = Join-Path $env:LOCALAPPDATA 'AI-Commerce'
            $candidates = @(
              (Join-Path $configRoot 'Chrome-Acquisition\config.json'),
              (Join-Path $configRoot 'chrome.json'),
              (Join-Path $configRoot 'chrome-acquisition.json')
            )
            $found = @($candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
            if ($found.Count -ne 1) { throw 'CONFIG_AMBIGUOUS_OR_ABSENT' }
            $config = [string]$found[0]
            $py = Join-Path $root '.venv\Scripts\python.exe'
            if (-not (Test-Path -LiteralPath $py -PathType Leaf)) {
              $cmd = Get-Command python.exe -ErrorAction SilentlyContinue
              if ($null -eq $cmd) { throw 'PYTHON_UNAVAILABLE' }
              $py = $cmd.Source
            }
            $oldPython = $env:PYTHONPATH
            try {
              $env:PYTHONPATH = Join-Path $root 'src'
              # The source-owned acquisition independently verifies the signed
              # Google Chrome executable, dedicated profile, exact loopback,
              # input desktop, ownership and zero conflicting root processes.
              $native = @(& $py -m ai_commerce.remote.chrome_acquisition launch --config $config --checkout $root --opt-in 2>&1 | ForEach-Object { [string]$_ })
              $exit = $LASTEXITCODE
            } finally {
              $env:PYTHONPATH = $oldPython
            }
            if ($exit -eq 0 -and $native.Count -eq 1) {
              $record = $native[0] | ConvertFrom-Json
              if ($record.status -ceq 'READY_ATTACH' -and $record.cdp_verified -eq $true -and
                  $record.launched -is [bool]) {
                $status = 'OBSERVED'; $code = 'CDP_9333_READY'
                $verified = $true; $launched = [bool]$record.launched
              } else { $code = 'RESULT_UNVERIFIED' }
            } else {
              # Never publish local paths, profile contents, argv or stderr.
              $matched = @($native | Where-Object { $_ -cmatch '^CHROME_ACQUISITION_BLOCKED: [A-Z0-9_]{1,70}$' })
              if ($matched.Count -eq 1 -and $matched[0] -cmatch '^CHROME_ACQUISITION_BLOCKED: ([A-Z0-9_]{1,70})$') {
                $code = [string]$Matches[1]
              } else { $code = 'NATIVE_RESULT_UNKNOWN' }
            }
          } catch {
            $safeCode = [string]$_.Exception.Message
            $known = @('BAD_HOST','BAD_ISSUE','NO_INTERACTIVE_SESSION','ELEVATED','SOURCE_DRIFT','NO_APPDATA','CONFIG_AMBIGUOUS_OR_ABSENT','PYTHON_UNAVAILABLE')
            $code = if ($known -ccontains $safeCode) { $safeCode } else { 'PRECHECK_UNKNOWN' }
          }
          $receipt = [ordered]@{status=$status; code=$code; source_sha=$env:GITHUB_SHA;
              cdp_port=9333; cdp_verified=$verified; launched=$launched; wake_sent=$false}
          $text = ConvertTo-Json -InputObject $receipt -Compress
          $bytes = [Text.Encoding]::UTF8.GetBytes($text)
          try {
            $stream = [IO.File]::Open($outFile,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
            try { $stream.Write($bytes,0,$bytes.Length); $stream.Flush($true) }
            finally { $stream.Dispose() }
          } catch { Write-Output 'D5_PERSONAL_RECEIPT_UNAVAILABLE'; exit 2 }
          Write-Output ('D5_PERSONAL_STATUS=' + $status + ';CODE=' + $code)
          exit 0
      - name: Publish closed public receipt
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path');
            const name = 'd5-personal-' + process.env.GITHUB_RUN_ID + '-' +
              process.env.GITHUB_RUN_ATTEMPT + '.json';
            const target = path.join(process.env.RUNNER_TEMP, name);
            let result = {status:'BLOCKED',code:'RECEIPT_UNAVAILABLE',
              source_sha:context.sha,cdp_port:9333,cdp_verified:false,
              launched:false,wake_sent:false};
            try {
              if (fs.statSync(target).size > 1024) throw Error();
              const parsed = JSON.parse(fs.readFileSync(target,'utf8'));
              const fields = ['status','code','source_sha','cdp_port',
                'cdp_verified','launched','wake_sent'];
              if (!parsed || Array.isArray(parsed) ||
                  Object.keys(parsed).sort().join() !== fields.sort().join() ||
                  !['OBSERVED','BLOCKED'].includes(parsed.status) ||
                  !/^[A-Z0-9_]{1,70}$/.test(parsed.code) ||
                  parsed.source_sha !== context.sha || parsed.cdp_port !== 9333 ||
                  typeof parsed.cdp_verified !== 'boolean' ||
                  typeof parsed.launched !== 'boolean' || parsed.wake_sent !== false ||
                  (parsed.status === 'OBSERVED' &&
                   (parsed.code !== 'CDP_9333_READY' || !parsed.cdp_verified))) throw Error();
              result = parsed;
            } catch (_) {}
            await github.rest.issues.createComment({...context.repo,
              issue_number:context.issue.number,
              body:'AI_COMMERCE_D5_PERSONAL_BOOT_RESULT_V1\n' + JSON.stringify(result)});
