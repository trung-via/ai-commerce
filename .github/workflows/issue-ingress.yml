  # Owner-only, read-only Playwright connection proof for the already verified
  # isolated 9444 browser. This NEVER visits a page or reads a browser context.
  hostops-d5-playwright-9444-read:
    if: >-
      github.repository == 'trung-via/ai-commerce' &&
      github.actor == github.repository_owner &&
      github.event_name == 'issues' && github.event.action == 'opened' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[HOSTOPS D5 9444 PLAYWRIGHT READ] ')
    runs-on: [self-hosted, Windows, ai-commerce-hostops]
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    concurrency:
      group: d5-9444-playwright-read
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify two Playwright client-only attachments on CDP 9444
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $env:RUNNER_TEMP ('d5-playwright-9444-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.json')
          $status = 'BLOCKED'
          $code = 'INVALID_EVENT'
          $attaches = 0
          $protocol = $false
          try {
            if ($env:OS -cne 'Windows_NT' -or
                $env:GITHUB_ACTIONS -cne 'true' -or
                $env:GITHUB_REPOSITORY -cne 'trung-via/ai-commerce') { throw 'INVALID_ENVIRONMENT' }
            $evt = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($evt.action -cne 'opened' -or
                $evt.issue.user.login -cne 'trung-via' -or
                $evt.sender.login -cne 'trung-via' -or
                -not $evt.issue.title.StartsWith('[HOSTOPS D5 9444 PLAYWRIGHT READ] ') -or
                [string]$evt.issue.body -cne '{"schema":"ai-commerce.d5.playwright9444.v1","operation":"ATTACH_READONLY_TWICE","parameters":{}}') {
              throw 'INVALID_EVENT'
            }
            if ([Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) {
              throw 'NO_INTERACTIVE_SESSION'
            }
            $principal = [Security.Principal.WindowsPrincipal]::new(
              [Security.Principal.WindowsIdentity]::GetCurrent())
            if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw 'ELEVATED'
            }
            $root = $env:GITHUB_WORKSPACE
            $head = (& git -C $root rev-parse HEAD 2>$null | Out-String).Trim()
            $remote = (& git -C $root remote get-url origin 2>$null | Out-String).Trim()
            $dirty = @(& git -C $root status --porcelain=v1 --untracked-files=no 2>$null)
            if ($head -cne $env:GITHUB_SHA -or $dirty.Count -ne 0 -or
                $remote -cnotin @(
                  'https://github.com/trung-via/ai-commerce.git',
                  'https://github.com/trung-via/ai-commerce',
                  'git@github.com:trung-via/ai-commerce.git')) { throw 'SOURCE_DRIFT' }
            $oldPythonPath = $env:PYTHONPATH
            try {
              $env:PYTHONPATH = Join-Path $root 'src'
              # Source-owned verify_playwright_attach connects and checks
              # is_connected ONLY. No browser.close(), browser.contexts,
              # pages, cookies, URLs, navigation, or target enumeration.
              # Two distinct Playwright clients, plus CDP checks before/after.
              $script = @(
                'from types import SimpleNamespace',
                'from ai_commerce.remote.chrome_acquisition import _probe_cdp, verify_playwright_attach',
                'e = SimpleNamespace(endpoint="http://127.0.0.1:9444", port=9444)',
                'try:',
                '    _probe_cdp(e)',
                'except Exception:',
                '    print("CDP_UNAVAILABLE"); raise SystemExit(0)',
                'try:',
                '    import playwright.sync_api',
                'except ImportError:',
                '    print("PLAYWRIGHT_MODULE_UNAVAILABLE"); raise SystemExit(0)',
                'for i in range(2):',
                '    try:',
                '        verify_playwright_attach(e)',
                '    except Exception:',
                '        print("PLAYWRIGHT_ATTACH_FAILED"); raise SystemExit(0)',
                '    try:',
                '        _probe_cdp(e)',
                '    except Exception:',
                '        print("CDP_AFTER_ATTACH_UNAVAILABLE"); raise SystemExit(0)',
                'print("PLAYWRIGHT_TWICE_VERIFIED")'
              ) -join [Environment]::NewLine
              $output = @(& python -B -c $script 2>$null | ForEach-Object { [string]$_ })
              $exit = $LASTEXITCODE
            } finally { $env:PYTHONPATH = $oldPythonPath }
            if ($exit -eq 0 -and $output.Count -eq 1 -and
                [string]$output[0] -cin @('CDP_UNAVAILABLE','PLAYWRIGHT_MODULE_UNAVAILABLE',
                  'PLAYWRIGHT_ATTACH_FAILED','CDP_AFTER_ATTACH_UNAVAILABLE',
                  'PLAYWRIGHT_TWICE_VERIFIED')) {
              $status = 'OBSERVED'
              $code = [string]$output[0]
              if ($code -ceq 'PLAYWRIGHT_TWICE_VERIFIED') {
                $attaches = 2
                $protocol = $true
              }
            } else { $code = 'CLIENT_RESULT_UNKNOWN' }
          } catch {
            $reason = [string]$_.Exception.Message
            $allowed = @('INVALID_ENVIRONMENT','INVALID_EVENT',
              'NO_INTERACTIVE_SESSION','ELEVATED','SOURCE_DRIFT')
            $code = if ($allowed -ccontains $reason) { $reason } else { 'CLIENT_RESULT_UNKNOWN' }
          }
          $receipt = [ordered]@{
            status = $status
            code = $code
            source_sha = $env:GITHUB_SHA
            cdp_port = 9444
            attach_count = $attaches
            protocol_verified = $protocol
            chat_verified = $false
            browser_mutated = $false
            wake_sent = $false
          }
          try {
            $bytes = [Text.Encoding]::UTF8.GetBytes((ConvertTo-Json -InputObject $receipt -Compress))
            $stream = [IO.File]::Open($file,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
            try { $stream.Write($bytes,0,$bytes.Length); $stream.Flush($true) }
            finally { $stream.Dispose() }
          } catch { Write-Output 'D5_PLAYWRIGHT_RECEIPT_UNAVAILABLE'; exit 2 }
          Write-Output ('D5_PLAYWRIGHT_9444_STATUS=' + $status + ';CODE=' + $code)
      - name: Publish sanitized Playwright read-only result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path');
            const file = path.join(process.env.RUNNER_TEMP,
              'd5-playwright-9444-' + process.env.GITHUB_RUN_ID + '-' +
              process.env.GITHUB_RUN_ATTEMPT + '.json');
            let result = {status:'BLOCKED',code:'RECEIPT_UNAVAILABLE',
              source_sha:context.sha,cdp_port:9444,attach_count:0,
              protocol_verified:false,chat_verified:false,
              browser_mutated:false,wake_sent:false};
            try {
              if (fs.statSync(file).size > 1024) throw Error();
              const r = JSON.parse(fs.readFileSync(file,'utf8'));
              const names = ['status','code','source_sha','cdp_port','attach_count',
                'protocol_verified','chat_verified','browser_mutated','wake_sent'];
              const codes = ['INVALID_ENVIRONMENT','INVALID_EVENT',
                'NO_INTERACTIVE_SESSION','ELEVATED','SOURCE_DRIFT',
                'CDP_UNAVAILABLE','PLAYWRIGHT_MODULE_UNAVAILABLE',
                'PLAYWRIGHT_ATTACH_FAILED','CDP_AFTER_ATTACH_UNAVAILABLE',
                'PLAYWRIGHT_TWICE_VERIFIED','CLIENT_RESULT_UNKNOWN'];
              if (!r || Array.isArray(r) ||
                  Object.keys(r).sort().join() !== names.sort().join() ||
                  !['OBSERVED','BLOCKED'].includes(r.status) ||
                  !codes.includes(r.code) ||
                  r.source_sha !== context.sha || r.cdp_port !== 9444 ||
                  !Number.isInteger(r.attach_count) ||
                  ![0,2].includes(r.attach_count) ||
                  typeof r.protocol_verified !== 'boolean' ||
                  r.chat_verified !== false || r.browser_mutated !== false ||
                  r.wake_sent !== false ||
                  (r.status === 'OBSERVED' &&
                   (r.attach_count !== (r.code === 'PLAYWRIGHT_TWICE_VERIFIED' ? 2 : 0) ||
                    r.protocol_verified !== (r.code === 'PLAYWRIGHT_TWICE_VERIFIED')))) throw Error();
              result = r;
            } catch (_) {}
            await github.rest.issues.createComment({...context.repo,
              issue_number:context.issue.number,
              body:'AI_COMMERCE_D5_PLAYWRIGHT_9444_READ_V1\n'+JSON.stringify(result)});

