name: AI Commerce Issue ingress (EF02 / HostOps Personal)
run-name: "${{ github.event.issue.title }} (#${{ github.event.issue.number }}, ${{ github.event.action }})"
# One top-level run per Issue event, rather than four unrelated runs.
# Keep the original EF02 and HostOps validation/authorization unchanged in called workflows.
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  ef02:
    if: >-
      startsWith(github.event.issue.title, '[EF02]') &&
      (github.event.action == 'opened' || github.event.action == 'labeled')
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/ef02-batch.yml

  hostops-readonly:
    if: >-
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[HOSTOPS] ')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/hostops-readonly.yml

  hostops-v2:
    if: >-
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[HOSTOPS2] ')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/hostops-v2.yml

  hostops-v3:
    if: >-
      github.event.action == 'opened' &&
      github.event.repository.private == true &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[HOSTOPS3] ')
    permissions:
      contents: read
    uses: ./.github/workflows/hostops-v3.yml

  hostops-personal:
    if: >-
      github.event.repository.full_name == 'trung-via/ai-commerce' &&
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issues' &&
         github.event.action == 'opened' &&
         github.event.issue.user.login == github.repository_owner &&
         startsWith(github.event.issue.title, '[HOSTOPS READ] ')) ||
        (github.event_name == 'issue_comment' &&
         github.event.action == 'created' &&
         github.event.issue.user.login == github.repository_owner &&
         github.event.comment.user.login == github.repository_owner &&
         startsWith(github.event.issue.title, '[HOSTOPS WRITE] ') &&
         github.event.comment.body == format('APPROVE WRITE #{0}', github.event.issue.number))
      )
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/hostops-personal.yml
