name: Recover A14 L04 #202 and verify exact integrated candidate
on:
  push:
    branches: [recovery/a14-l04-verified-20261102]
permissions:
  contents: write
  actions: read
concurrency:
  group: a14-l04-source-20261102
  cancel-in-progress: false
jobs:
  import_source:
    if: github.repository == 'trung-via/ai-commerce'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.recover.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Assert pinned recovery branch and main parent
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/recovery/a14-l04-verified-20261102"
          git merge-base --is-ancestor 8870c26954181fbef7ba26091c55c7139792fe7e HEAD
          test ! -e tests/test_a14_attribution.py
      - name: Read private, independently verified HostOps #214 artifact
        uses: actions/download-artifact@v4
        with:
          name: hostops-v2-ef02-202-source-41405153938
          run-id: 41405153938
          github-token: ${{ github.token }}
          path: .local/old-a14-source
      - name: Pin all 12 verified source bytes and strip temporary workflow from final tree
        id: recover
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, importlib.util, io, pathlib, subprocess, zipfile
          archive=pathlib.Path(".local/old-a14-source/verified-source.zip").read_bytes()
          assert hashlib.sha256(archive).hexdigest()=="8c1e03d364e87c0d59390bb7f8e0cf2fac92b64dbd0574db01e8cabea3f690de", "ZIP_HASH_DRIFT"
          spec=importlib.util.spec_from_file_location("l04manifest","scripts/hostops_ef02_202_recovery.py")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          expected=m.EXPECTED
          assert len(expected)==12
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert set(z.namelist())==set(expected), "ARCHIVE_SET_DRIFT"
              for name, digest in sorted(expected.items()):
                  p=pathlib.Path(name)
                  assert not p.exists() and not p.is_symlink(), "PATH_ALREADY_EXISTS"
                  assert name.startswith(("src/ai_commerce/affiliate_attribution/","contracts/AffiliateAttributionEvidence.","tests/test_a14_attribution.","docs/engineering/A14_L04_")), "SCOPE_DRIFT"
                  assert z.getinfo(name).file_size<=2_000_000
                  content=z.read(name)
                  assert hashlib.sha256(content).hexdigest()==digest, "SOURCE_HASH_DRIFT:"+name
                  if name.endswith("/consumer-tests.txt"):
                      assert content.count(b"\r\n")==24, "EOL_SHAPE_DRIFT"
                      lf=content.replace(b"\r\n", b"\n")
                      assert b"\r" not in lf
                      clean=subprocess.run(["git","hash-object","--stdin","--path="+name],input=content,capture_output=True,check=True).stdout.strip()
                      canonical=subprocess.run(["git","hash-object","--stdin"],input=lf,capture_output=True,check=True).stdout.strip()
                      assert clean==canonical, "GIT_CLEAN_MISMATCH"
                      content=lf
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(content)
                  subprocess.run(["git","add","--",name],check=True)
                  staged=subprocess.run(["git","show",":"+name],capture_output=True,check=True).stdout
                  assert staged==content, "INDEX_BYTE_MISMATCH:"+name
          subprocess.run(["git","rm","--",".github/workflows/a14-l04-recovery-bootstrap.yml"],check=True)
          changed=set(subprocess.run(["git","diff","--cached","--name-only"],capture_output=True,text=True,check=True).stdout.splitlines())
          assert changed==set(expected)|{".github/workflows/a14-l04-recovery-bootstrap.yml"}, "CHANGED_SCOPE_DRIFT"
          print("RECOVERED_12_12_SHA256_VERIFIED")
          print("SAFE_CRLF_TO_LF_BEFORE_VERIFY")
          print("INDEX_BYTES_IDENTICAL")
          PY
          git config user.name "ai-commerce-recovery"
          git config user.email "ai-commerce-recovery@users.noreply.github.com"
          git commit -m "recover(A14 L04): 12 SHA-verified source files from EF02 #202"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:refs/heads/recovery/a14-l04-verified-20261102
          test "$(git diff --name-only 8870c26954181fbef7ba26091c55c7139792fe7e HEAD | wc -l)" -eq 12
  verify:
    needs: import_source
    if: needs.import_source.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.import_source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Attest exact source commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.import_source.outputs.sha }}"
          test "$(git diff --name-only 8870c26954181fbef7ba26091c55c7139792fe7e HEAD | wc -l)" -eq 12
          echo "EXACT_L04_CANDIDATE_SHA=$(git rev-parse HEAD)"
      - name: FFmpeg Ubuntu
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
      - name: FFmpeg Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFMPEG_INSTALL_FAILED" }
      - name: Install project and pytest tools
        run: python -m pip install -e ".[dev]" Pillow
      - name: Targeted A14 L04 tests
        run: python -m pytest tests/test_a14_attribution.py -q -n 4 --dist loadfile
      - name: Entire project integration tests
        run: python -m pytest tests -q -n 4 --dist loadfile
