name: EF02 M0-R hosted remote checkpoint live (no model)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create-only claim and pre-spawn checkpoint, no EF01
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: python .github/scripts/ef02-m0r-hosted-checkpoint-probe.py
      - name: Preserve hosted checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ef02-m0r-hosted-checkpoint-${{ github.run_id }}
          path: .local/ef02-m0r/remote-checkpoint.json
          if-no-files-found: warn
          retention-days: 14

  readback:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently read GitHub refs with existing EF02 reconciler
        uses: actions/github-script@v7
        with:
          script: |
            const reconcile = require('./.github/scripts/ef02-reconcile.cjs');
            const repoFullName = context.repo.owner + '/' + context.repo.repo;
            const attemptId = 'm0r-hosted-checkpoint-' + context.runId;
            const action = {action_id:'m0r-hosted-checkpoint',
              attempt_id:attemptId,depends_on:[]};
            const observed = await reconcile.inspectAction(
              github, repoFullName, context.sha, action);
            const ok = observed.claim === 'CLAIM_REF_VERIFIED' &&
              observed.pre_spawn === 'PRESPAWN_REF_VERIFIED_NOT_PROVIDER_PROOF' &&
              observed.candidate === 'NO_CANDIDATE_REF_OBSERVED';
            core.info('M0R_REMOTE_CHECKPOINT_READBACK=' + JSON.stringify(observed));
            if (!ok) {
              core.setFailed('M0R_REMOTE_CHECKPOINT_LINEAGE_OR_READBACK_UNVERIFIED');
              return;
            }
            core.info('M0R_REMOTE_CHECKPOINT_LIVE_PASS: claim verified; ' +
              'pre-spawn verified; candidate absent; no EF01/model/Windows executor.');
