name: EF02 M0-R Windows after-spawn boundary (no model)
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  windows-afterspawn:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.event.issue.title == '[M0R] Windows EF02 after-spawn UNKNOWN probe' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    permissions:
      contents: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install package, no provider
        shell: pwsh
        run: python -m pip install -e .
      - name: Exercise real GitHub checkpoint with inert Python child
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          python .github/scripts/ef02-m0r-windows-boundary-probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ef02-m0r-windows-boundary-${{ github.run_id }}
          path: .local/ef02-m0r/**
          if-no-files-found: warn
          retention-days: 14
