name: "EF02 A12-02 verified A12-01 candidate worktree preflight (no model)"
on:
  push:
    branches:
      - repair/a12-02-preserve-candidate-preflight-20261030
    paths:
      - .github/workflows/ef02-a12-candidate-source-preflight.yml
      - .gitattributes
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate A12-01 exact-source Git status before any Codex
        shell: pwsh
        run: |
          ./scripts/EF02-A12-Worktree-Preflight.ps1 -SourceSha ${{ github.sha }}
