name: EF02 Antigravity G3 static read and G3B bounded write probe
on:
  workflow_dispatch:
  # G3 READ: exact owner-created diagnostic issue, no EF01/provider invocation.
  # G3B: a separate gated one-call disposable-scratch provider write probe.
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.action == 'opened' &&
        github.repository == 'trung-via/ai-commerce' &&
        github.actor == github.repository_owner &&
        github.event.issue.user.login == github.repository_owner &&
        github.event.issue.title == '[EF02 HEADLESS READ] #710 G3'
      )
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Bounded same-session AGY static probe — no model and no raw account output
        shell: pwsh
        run: |
          # Capture all original preflight output privately in memory: it may
          # include the Windows runner account and must NOT be printed to GitHub.
          $resultLines = @()
          $exitCode = 2
          try {
            $resultLines = @(& pwsh -NoProfile -NonInteractive -File ./scripts/EF02-Antigravity-Headless-Preflight.ps1 -Workspace "$env:GITHUB_WORKSPACE" 2>&1)
            $exitCode = $LASTEXITCODE
          } catch {
            $exitCode = 2
          }
          $passMarkers = @($resultLines | Where-Object { [string]$_ -eq 'AGY_PREFLIGHT_PASS_NO_MODEL' })
          if ($exitCode -eq 0 -and $passMarkers.Count -eq 1) {
            Write-Output 'AGY_G3_STATIC_PREFLIGHT=PASS_NO_MODEL'
            Write-Output 'EFFECTIVE_WRITE_PERMISSION=UNPROVEN_NO_MODEL'
            Write-Output 'MODEL_AUTH_QUOTA=UNPROVEN_NO_MODEL'
          } else {
            Write-Output 'AGY_G3_STATIC_PREFLIGHT=FAILED_NO_MODEL'
            Write-Output 'EFFECTIVE_WRITE_PERMISSION=UNPROVEN_NO_MODEL'
            Write-Output 'MODEL_AUTH_QUOTA=UNPROVEN_NO_MODEL'
            exit 2
          }
  g3b-write:
    # G3B is a distinct bounded provider-effect probe; G3 above remains no-model.
    # It can run only once per owner-created exact-title Issue, never from dispatch.
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.repository == 'trung-via/ai-commerce' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[EF02 HEADLESS WRITE] #710 G3B' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    timeout-minutes: 4
    concurrency:
      group: epwo-710-g3b-owner-probe
      cancel-in-progress: false
    steps:
      - name: Checkout trusted main without credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: One bounded Antigravity model call and exact private sentinel witness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = @'
          import itertools, os, pathlib, secrets, shutil, stat, subprocess, tempfile
          
          def outcome(result, provider="NOT_CALLED", effective="UNPROVEN", scope="UNPROVEN"):
              print("AGY_G3B_RESULT=" + result)
              print("AGY_G3B_PROVIDER_RETURN=" + provider)
              print("AGY_G3B_EFFECTIVE_WRITE=" + effective)
              print("AGY_G3B_SCRATCH_SCOPE=" + scope)
              print("AGY_G3B_OUTSIDE_WRITES=UNPROVEN")
              print("AGY_G3B_QUOTA=UNPROVEN")
              raise SystemExit(0 if result == "PASS_SENTINEL" else 2)
          
          if os.name != "nt" or not os.environ.get("RUNNER_TEMP") or not os.environ.get("GITHUB_WORKSPACE"):
              outcome("HOLD_WINDOWS_ENV_UNPROVEN")
          binary = shutil.which("agy")
          if binary is None:
              outcome("HOLD_AGY_BINARY_UNAVAILABLE")
          temp = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          checkout = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if not temp.is_dir() or temp == checkout or temp in checkout.parents or checkout in temp.parents:
              outcome("HOLD_TEMP_SOURCE_OVERLAP")
          try:
              root = pathlib.Path(tempfile.mkdtemp(prefix="ai-commerce-g3b-", dir=temp)).resolve()
              root_original = root.lstat()
          except OSError:
              outcome("HOLD_SCRATCH_CREATION_UNPROVEN")
          if (root.parent != temp or root.is_symlink() or
                  not stat.S_ISDIR(root_original.st_mode) or
                  root_original.st_file_attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT):
              outcome("HOLD_SCRATCH_IDENTITY")
          nonce = secrets.token_hex(16)
          target = root / "proof.txt"
          if target.exists() or target.is_symlink():
              outcome("HOLD_PREEXISTING_PROOF")
          prompt = ("Create ONLY one new file at " + str(target) + " containing exactly " +
                    nonce + " (a single trailing newline is allowed). Use your file-write tool. " +
                    "Do not change any other files. Do not run commands or access external URLs.")
          args = [binary, "--print", prompt, "--add-dir", str(root),
                  "--model", "gemini-3.8-flash", "--effort", "high", "--mode", "accept-edits",
                  "--disable-slash-commands", "--output-format", "json"]
          try:
              proc = subprocess.Popen(args, cwd=root, stdin=subprocess.DEVNULL,
                                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                                      creationflags=subprocess.CREATE_NEW_PROCESS_GROUP)
          except (OSError, ValueError):
              outcome("HOLD_PROVIDER_SPAWN_UNPROVEN")
          try:
              proc.wait(timeout=90)
          except subprocess.TimeoutExpired:
              try:
                  subprocess.run(["taskkill", "/PID", str(proc.pid), "/T", "/F"],
                                 capture_output=True, timeout=12, check=False)
                  proc.wait(timeout=5)
              except Exception:
                  pass
              outcome("HOLD_TIMEOUT_EFFECT_UNKNOWN", provider="TIMEOUT_UNKNOWN")
          except Exception:
              outcome("HOLD_PROVIDER_RETURN_UNPROVEN", provider="UNKNOWN")
          if proc.returncode != 0:
              outcome("HOLD_PROVIDER_NONZERO", provider="NONZERO")
          try:
              leaf = target.lstat()
              root_after = root.lstat()
              if (root_after.st_dev, root_after.st_ino) != (root_original.st_dev, root_original.st_ino):
                  outcome("HOLD_SCRATCH_ROOT_DRIFT", provider="EXIT_ZERO")
              if (not stat.S_ISREG(leaf.st_mode) or leaf.st_nlink != 1 or
                      leaf.st_file_attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT):
                  outcome("HOLD_NO_WRITE_WITNESS", provider="EXIT_ZERO")
              with target.open("rb") as stream:
                  handle = os.fstat(stream.fileno())
                  if (handle.st_dev, handle.st_ino) != (leaf.st_dev, leaf.st_ino):
                      outcome("HOLD_PROOF_FILE_DRIFT", provider="EXIT_ZERO")
                  data = stream.read(129)
              if (target.lstat().st_dev, target.lstat().st_ino) != (leaf.st_dev, leaf.st_ino):
                  outcome("HOLD_PROOF_FILE_DRIFT", provider="EXIT_ZERO")
              names = sorted(p.name for p in itertools.islice(root.iterdir(), 2))
              if (root.lstat().st_dev, root.lstat().st_ino) != (root_original.st_dev, root_original.st_ino):
                  outcome("HOLD_SCRATCH_ROOT_DRIFT", provider="EXIT_ZERO")
          except (OSError, ValueError):
              outcome("HOLD_PROOF_READ_UNPROVEN", provider="EXIT_ZERO")
          if len(data) > 128 or data.rstrip(b"\r\n") != nonce.encode("ascii"):
              outcome("HOLD_WRONG_PROOF_BYTES", provider="EXIT_ZERO")
          if names != ["proof.txt"]:
              outcome("HOLD_EXTRA_SCRATCH_WRITES", provider="EXIT_ZERO", effective="PROVEN")
          outcome("PASS_SENTINEL", provider="EXIT_ZERO", effective="PROVEN", scope="ONLY_SENTINEL_IN_TEMP")
          '@
          & python -c $probe
          exit $LASTEXITCODE
  g4-forensic:
    # Independent fixed historical #710 forensic read. Never rereun EF02/model.
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.repository == 'trung-via/ai-commerce' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[EPWO 710 G4 FORENSIC READ] #710' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    timeout-minutes: 5
    concurrency:
      group: epwo-710-g4-forensic-read
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout protected main for fixed local read only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Observe immutable historical local evidence without model or journal writes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          $probe = @'
          import itertools
          import json
          import os
          from pathlib import Path
          import stat
          import tempfile
          from ai_commerce.hostops_v3 import ef02_attempt_r02_readonly as safe
          
          BATCH = "epwo-wp01-r2c-ef02-m0r-intake-shared-fixture-rootfix-g4argon-medium-20261109"
          ACTION = "EPWO-WP01-R2C-VALIDATED-INTAKE-M0R-G4ARGONMED-001"
          ATTEMPT = "epwo_wp01_r2c_preflight_m0r_g4argonmedium_20261109_01"
          SOURCE = "0d6fb5b05281d765eee18b260117577f36893d0b"
          EVIDENCE_ROOT = safe.EVIDENCE_ROOT.parents[1] / BATCH / (ACTION + "-" + ATTEMPT)
          FILES = ("ef01/provider_boundary.json", "ef01/provider_return_observed.json",
                   "ef01/engineering_result.json")
          EXPECTED = ("BEFORE_EXECUTOR_SUBPROCESS", "EXECUTOR_SUBPROCESS_RETURNED", None)
          MAX_BYTES = 4 * 1024 * 1024
          
          def _receipt(relative, stage):
              target = EVIDENCE_ROOT.joinpath(*relative.split("/"))
              try:
                  if target.is_symlink():
                      return "UNSAFE"
                  if not target.exists():
                      return "MISSING"
                  if not safe._safe_absolute(target):
                      return "UNSAFE"
                  before = target.lstat()
                  if before.st_size < 2 or before.st_size > MAX_BYTES:
                      return "UNSAFE"
                  with target.open("rb") as stream:
                      opened = os.fstat(stream.fileno())
                      content = stream.read(MAX_BYTES + 1)
                      closed = os.fstat(stream.fileno())
                  identity = lambda v: (v.st_dev, v.st_ino, v.st_size, v.st_mtime_ns, v.st_nlink)
                  if (len(content) > MAX_BYTES or identity(before) != identity(opened)
                          or identity(opened) != identity(closed) or not safe._safe_absolute(target)):
                      return "UNSAFE"
                  record = json.loads(content.decode("utf-8-sig"))
                  if not isinstance(record, dict) or record.get("attempt_id") != ATTEMPT:
                      return "UNSAFE"
                  if stage is not None and record.get("stage") != stage:
                      return "UNSAFE"
                  if relative == FILES[2] and record.get("work_id") != BATCH + ":" + ACTION:
                      return "UNSAFE"
                  return "PRESENT_UNVERIFIED"
              except (OSError, ValueError, TypeError, UnicodeError):
                  return "READ_UNKNOWN"
          
          def _evidence():
              try:
                  batch = EVIDENCE_ROOT.parent
                  if batch.is_symlink():
                      return "ROOT_UNSAFE", ("READ_UNKNOWN",) * 3
                  if not batch.exists():
                      return "BATCH_ABSENT", ("ROOT_ABSENT",) * 3
                  if not safe._safe_absolute(batch, directory=True):
                      return "ROOT_UNSAFE", ("READ_UNKNOWN",) * 3
                  if EVIDENCE_ROOT.is_symlink():
                      return "ROOT_UNSAFE", ("READ_UNKNOWN",) * 3
                  if not EVIDENCE_ROOT.exists():
                      return "ACTION_ABSENT", ("ROOT_ABSENT",) * 3
                  if not safe._safe_absolute(EVIDENCE_ROOT, directory=True):
                      return "ROOT_UNSAFE", ("READ_UNKNOWN",) * 3
                  return "ACTION_PRESENT", tuple(_receipt(p, s) for p, s in zip(FILES, EXPECTED))
              except (OSError, ValueError):
                  return "ROOT_READ_UNKNOWN", ("READ_UNKNOWN",) * 3
          
          def _worktree():
              try:
                  base = Path(tempfile.gettempdir())
                  if not safe._safe_absolute(base, directory=True):
                      return "WORKTREE_READ_UNKNOWN"
                  matches = list(itertools.islice(base.glob("ai-commerce-ef02-" + ACTION + "-*"), 2))
                  if not matches:
                      return "WORKTREE_ABSENT"
                  if len(matches) != 1:
                      return "WORKTREE_AMBIGUOUS"
                  item = matches[0]
                  if item.is_symlink() or not safe._safe_absolute(item, directory=True):
                      return "WORKTREE_UNSAFE"
                  return "WORKTREE_SINGLE_UNVERIFIED"
              except (OSError, ValueError, RuntimeError):
                  return "WORKTREE_READ_UNKNOWN"
          
          def observe():
              root, (before, returned, terminal) = _evidence()
              return {"status": "HOLD_UNKNOWN_EFFECT", "root": root, "before": before,
                      "return": returned, "terminal": terminal, "worktree": _worktree(),
                      "replay_authorized": "FALSE", "provider_outcome_proven": "FALSE"}
          
          def main():
              try:
                  result = observe()
                  for key in ("status", "root", "before", "return", "terminal", "worktree",
                              "replay_authorized", "provider_outcome_proven"):
                      print("EPWO_710_G4_" + key.upper() + "=" + result[key])
              except Exception:
                  print("EPWO_710_G4_STATUS=HOLD_UNKNOWN_EFFECT")
                  print("EPWO_710_G4_OBSERVER=READ_UNKNOWN")
                  print("EPWO_710_G4_REPLAY_AUTHORIZED=FALSE")
          
          if __name__ == "__main__":
              main()
          '@
          & python -B -c $probe
          exit $LASTEXITCODE

  wh03b-745-forensic:
    # Exact, owner-created one-shot source-locked Windows READ only for #745.
    # Never accept an Issue body / arbitrary user-selected attempt, PID or path.
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.repository == 'trung-via/ai-commerce' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[WH03B #745 NATIVE FORENSIC READ] exact attempt only' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    timeout-minutes: 5
    concurrency:
      group: wh03b-745-native-forensic-read
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout protected main, no GitHub credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Observe exact historical PID/time boundary, emit enums only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $proc = Get-CimInstance Win32_Process -Filter 'ProcessId=25736' -ErrorAction Stop
            if ($null -eq $proc) {
              Write-Output 'WH03B_745_PID=PID_ABSENT_ON_THIS_RUNNER'
            } else {
              $created = ([datetime]$proc.CreationDate).ToUniversalTime()
              if ($created -ge [datetime]'2026-11-09T19:21:00Z' -and
                  $created -le [datetime]'2026-11-09T19:43:12Z') {
                Write-Output 'WH03B_745_PID=PID_WINDOW_MATCH_UNATTESTED'
              } else {
                Write-Output 'WH03B_745_PID=PID_REUSED_OR_UNRELATED'
              }
            }
          } catch {
            Write-Output 'WH03B_745_PID=PROCESS_READ_UNKNOWN'
          }
          # No process command line, credentials, exact local path or PID creation date printed.
      - name: Observe fixed on-disk EF01 receipts and detached worktree, without writes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          $probe = @'
          import itertools
          import json
          import os
          from pathlib import Path
          import tempfile
          from ai_commerce.hostops_v3 import ef02_attempt_r02_readonly as safe

          BATCH = "wh03b-native-fallback-agy38flashhigh-20261110-r2b"
          ACTION = "WH03B-NATIVE-REGISTRATION-ADAPTER-AGY38FLASH-HIGH-R2B-001"
          ATTEMPT = "wh03b_native_adapter_agy38flashhigh_5e8503b0_20261110_r2b"
          SOURCE = "5e8503b09f5100a38dfb5ae5e08e3020b9b05790"
          ISSUE = 745
          WORK_KEY = "fff53e26ab6677786836d09f10b798c9ebcdfe1d0e872dab5130a97cb83be351"
          JOURNAL_TIP = "29527952859fb8421709345c34fb476a38a81707"
          EVIDENCE_ROOT = safe.EVIDENCE_ROOT.parents[1] / BATCH / (ACTION + "-" + ATTEMPT)
          EXPECTED = (
              ("ef01/provider_boundary.json", "BEFORE_EXECUTOR_SUBPROCESS"),
              ("ef01/provider_return_observed.json", "EXECUTOR_SUBPROCESS_RETURNED"),
              ("ef01/engineering_result.json", None),
          )
          MAX_BYTES = 4 * 1024 * 1024

          def _file_state(rel, expected_stage):
              target = EVIDENCE_ROOT.joinpath(*rel.split("/"))
              try:
                  if target.is_symlink():
                      return "UNSAFE"
                  if not target.exists():
                      return "MISSING"
                  if not safe._safe_absolute(target):
                      return "UNSAFE"
                  before = target.lstat()
                  if before.st_size < 2 or before.st_size > MAX_BYTES:
                      return "UNSAFE"
                  with target.open("rb") as stream:
                      opened = os.fstat(stream.fileno())
                      raw = stream.read(MAX_BYTES + 1)
                      closed = os.fstat(stream.fileno())
                  identity = lambda st: (st.st_dev, st.st_ino, st.st_size, st.st_mtime_ns, st.st_nlink)
                  if (len(raw) > MAX_BYTES or identity(before) != identity(opened)
                          or identity(opened) != identity(closed)
                          or not safe._safe_absolute(target)):
                      return "UNSAFE"
                  record = json.loads(raw.decode("utf-8-sig"))
                  if (type(record) is not dict or record.get("attempt_id") != ATTEMPT
                          or (expected_stage is not None and record.get("stage") != expected_stage)
                          or (rel == EXPECTED[2][0] and
                              record.get("work_id") != BATCH + ":" + ACTION)):
                      return "MISMATCH"
                  # A locally readable JSON is NOT an authenticated provider receipt.
                  return "PRESENT_UNVERIFIED"
              except (OSError, ValueError, TypeError, UnicodeError):
                  return "READ_UNKNOWN"

          def _evidence():
              batch = EVIDENCE_ROOT.parent
              try:
                  if batch.is_symlink():
                      return "ROOT_UNSAFE", ("UNOBSERVED_HERE",) * 3
                  if not batch.exists():
                      return "BATCH_ABSENT_HERE", ("UNOBSERVED_HERE",) * 3
                  if not safe._safe_absolute(batch, directory=True):
                      return "ROOT_UNSAFE", ("UNOBSERVED_HERE",) * 3
                  if EVIDENCE_ROOT.is_symlink():
                      return "ROOT_UNSAFE", ("UNOBSERVED_HERE",) * 3
                  if not EVIDENCE_ROOT.exists():
                      return "ACTION_ABSENT_HERE", ("UNOBSERVED_HERE",) * 3
                  if not safe._safe_absolute(EVIDENCE_ROOT, directory=True):
                      return "ROOT_UNSAFE", ("UNOBSERVED_HERE",) * 3
                  return "ACTION_PRESENT_UNVERIFIED", tuple(
                      _file_state(rel, stage) for rel, stage in EXPECTED)
              except (OSError, ValueError, RuntimeError):
                  return "ROOT_READ_UNKNOWN", ("READ_UNKNOWN",) * 3

          def _worktree():
              try:
                  base = Path(tempfile.gettempdir())
                  if not safe._safe_absolute(base, directory=True):
                      return "WORKTREE_READ_UNKNOWN"
                  matches = list(itertools.islice(
                      base.glob("ai-commerce-ef02-" + ACTION + "-*"), 2))
                  if not matches:
                      return "WORKTREE_ABSENT_HERE"
                  if len(matches) > 1:
                      return "WORKTREE_AMBIGUOUS"
                  if not safe._safe_absolute(matches[0], directory=True):
                      return "WORKTREE_UNSAFE"
                  return "WORKTREE_SINGLE_UNVERIFIED"
              except (OSError, RuntimeError, ValueError):
                  return "WORKTREE_READ_UNKNOWN"

          def observe():
              root, (before, returned, terminal) = _evidence()
              return {
                  "status": "HOLD_UNKNOWN_EFFECT",
                  "root": root,
                  "boundary": before,
                  "return": returned,
                  "terminal": terminal,
                  "worktree": _worktree(),
                  "journal": "PUBLIC_TIP_READ_SEPARATELY_NOT_MUTATED",
                  "replay_authorized": "FALSE",
                  "provider_effect_proven": "FALSE",
                  "native_identity_proven": "FALSE",
              }

          if __name__ == "__main__":
              try:
                  result = observe()
                  for key in ("status", "root", "boundary", "return", "terminal",
                              "worktree", "journal", "replay_authorized",
                              "provider_effect_proven", "native_identity_proven"):
                      print("WH03B_745_" + key.upper() + "=" + result[key])
              except Exception:
                  print("WH03B_745_STATUS=HOLD_UNKNOWN_EFFECT")
                  print("WH03B_745_OBSERVER=READ_UNKNOWN")
                  print("WH03B_745_REPLAY_AUTHORIZED=FALSE")
          '@
          & python -B -c $probe
          exit $LASTEXITCODE

  wp01-native-child-crash:
    # One-shot owner-created, no-vendor Windows child crash probe.
    # Never touch the original #710 WorkOwner, providers, or host-wide tasks.
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.repository == 'trung-via/ai-commerce' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[EPWO WP01 NATIVE CHILD CRASH] #466' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    timeout-minutes: 4
    concurrency:
      group: epwo-wp01-native-child-crash-one-shot
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout verified main, no retained credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Kill only our disposable Python child, prove UNKNOWN not replay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = @'
          import os
          import pathlib
          import stat
          import subprocess
          import sys
          import tempfile
          import time

          # Real Windows process lifecycle, but ONLY an owned disposable
          # child and marker in RUNNER_TEMP. No model or GitHub API calls.
          # It does not replay or authenticate historical WorkOwner #710.
          def observe():
              if os.name != "nt":
                  return "HOLD_WINDOWS_UNPROVEN"
              raw_temp = os.environ.get("RUNNER_TEMP")
              raw_checkout = os.environ.get("GITHUB_WORKSPACE")
              if not raw_temp or not raw_checkout:
                  return "HOLD_RUNNER_CONTEXT"
              temp = pathlib.Path(raw_temp).resolve()
              checkout = pathlib.Path(raw_checkout).resolve()
              if (not temp.is_dir() or temp.is_symlink()
                      or checkout == temp or checkout in temp.parents
                      or temp in checkout.parents):
                  return "HOLD_TEMP_SCOPE"
              try:
                  t = temp.lstat()
                  if getattr(t, "st_file_attributes", 0) & stat.FILE_ATTRIBUTE_REPARSE_POINT:
                      return "HOLD_TEMP_REPARSE"
              except OSError:
                  return "HOLD_TEMP_IDENTITY"
              try:
                  with tempfile.TemporaryDirectory(prefix="epwo-wp01-native-", dir=temp) as owned:
                      root = pathlib.Path(owned)
                      rst = root.lstat()
                      if (root.resolve().parent != temp or root.is_symlink()
                              or getattr(rst, "st_file_attributes", 0) &
                                  stat.FILE_ATTRIBUTE_REPARSE_POINT):
                          return "HOLD_OWNED_SCRATCH"
                      marker = root / "intent.marker"
                      child = None
                      try:
                          # No process tree kill, shell, credentials, arbitrary
                          # workflow input, or GitHub/worktree write.
                          command = (
                              "import pathlib,sys,time; "
                              "pathlib.Path(sys.argv[1]).write_bytes(b'INTENT_ONLY'); "
                              "time.sleep(30)"
                          )
                          child = subprocess.Popen(
                              [sys.executable, "-B", "-c", command, str(marker)],
                              cwd=str(root), stdin=subprocess.DEVNULL,
                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                              creationflags=subprocess.CREATE_NEW_PROCESS_GROUP,
                          )
                          deadline = time.monotonic() + 12
                          while time.monotonic() < deadline and not marker.is_file():
                              if child.poll() is not None:
                                  return "HOLD_CHILD_EARLY_EXIT"
                              time.sleep(0.05)
                          if not marker.is_file() or marker.is_symlink():
                              return "HOLD_INTENT_MISSING"
                          if marker.read_bytes() != b"INTENT_ONLY":
                              return "HOLD_INTENT_MISMATCH"
                          if child.poll() is not None:
                              return "HOLD_CHILD_NOT_RUNNING"
                          child.kill()
                          return_code = child.wait(timeout=8)
                          if return_code == 0 or child.poll() is None:
                              return "HOLD_KILL_UNPROVEN"
                          # Physical child death + leftover intent with no
                          # terminal receipt must remain UNKNOWN, never SUCCESS.
                          return "PASS_CHILD_KILLED_INTENT_ONLY_UNKNOWN"
                      finally:
                          if child is not None and child.poll() is None:
                              child.kill()
                              child.wait(timeout=8)
              except (OSError, ValueError, subprocess.SubprocessError):
                  return "HOLD_NATIVE_OBSERVATION"

          if __name__ == "__main__":
              try:
                  status = observe()
              except Exception:
                  status = "HOLD_NATIVE_OBSERVATION"
              print("EPWO_WP01_NATIVE_STATUS=" + status)
              print("EPWO_WP01_NATIVE_SCOPE=RUNNER_TEMP_CHILD_ONLY")
              print("EPWO_WP01_NATIVE_TERMINAL=ABSENT_UNVERIFIED")
              print("EPWO_WP01_NATIVE_HISTORICAL_710=NOT_TOUCHED")
              print("EPWO_WP01_NATIVE_PROVIDER=NOT_INVOKED")
              print("EPWO_WP01_NATIVE_REPLAY_AUTHORIZED=FALSE")
              raise SystemExit(0 if status == "PASS_CHILD_KILLED_INTENT_ONLY_UNKNOWN" else 2)
          '@
          & python -B -c $probe
          exit $LASTEXITCODE

  wp01-native-recovery-restart:
    # Owner-gated one-shot: disposable worker exit + FRESH read-only observer.
    # Does not restart Windows/GitHub runner or replay historical #710.
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.repository == 'trung-via/ai-commerce' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[EPWO WP01 NATIVE RESTART RECOVERY] #466' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    timeout-minutes: 4
    concurrency:
      group: epwo-wp01-native-recovery-restart-once
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main without stored credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Reopen disposable intent in new Python and deny replay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = @'
          import os
          import pathlib
          import stat
          import subprocess
          import sys
          import tempfile
          import time
          
          WORKER = (
              "import os,sys,time\n"
              "fd=os.open(sys.argv[1], os.O_CREAT|os.O_EXCL|os.O_WRONLY, 0o600)\n"
              "try:\n"
              "    assert os.write(fd,b'INTENT_ONLY') == len(b'INTENT_ONLY')\n"
              "    os.fsync(fd)\n"
              "finally:\n"
              "    os.close(fd)\n"
              "time.sleep(30)\n"
          )
          # A new interpreter is a read-only successor observer, NOT a new owner.
          READER = (
              "import pathlib,stat,sys\n"
              "root=pathlib.Path(sys.argv[1])\n"
              "marker=root/'intent.marker'\n"
              "terminal=root/'terminal.marker'\n"
              "try:\n"
              "    s=marker.lstat()\n"
              "    if not stat.S_ISREG(s.st_mode) or s.st_nlink!=1:\n"
              "        raise ValueError('unsafe marker')\n"
              "    if getattr(s,'st_file_attributes',0)&stat.FILE_ATTRIBUTE_REPARSE_POINT:\n"
              "        raise ValueError('reparse')\n"
              "    if marker.read_bytes()!=b'INTENT_ONLY' or terminal.exists() or terminal.is_symlink():\n"
              "        raise ValueError('missing/changed intent or terminal present')\n"
              "    print('HOLD_UNKNOWN_NO_REPLAY')\n"
              "except (OSError,ValueError):\n"
              "    print('HOLD_READER_UNVERIFIED')\n"
              "    sys.exit(2)\n"
          )
          
          def observe():
              if os.name != "nt":
                  return "HOLD_WINDOWS_UNPROVEN"
              raw_temp = os.environ.get("RUNNER_TEMP")
              raw_workspace = os.environ.get("GITHUB_WORKSPACE")
              if not raw_temp or not raw_workspace:
                  return "HOLD_RUNNER_CONTEXT"
              temp = pathlib.Path(raw_temp).resolve()
              checkout = pathlib.Path(raw_workspace).resolve()
              if (not temp.is_dir() or temp.is_symlink() or
                      temp == checkout or checkout in temp.parents or temp in checkout.parents):
                  return "HOLD_TEMP_SCOPE"
              if getattr(temp.lstat(),"st_file_attributes",0) & stat.FILE_ATTRIBUTE_REPARSE_POINT:
                  return "HOLD_TEMP_REPARSE"
              try:
                  with tempfile.TemporaryDirectory(prefix="epwo-wp01-restart-",dir=temp) as owned:
                      root = pathlib.Path(owned)
                      rootstat = root.lstat()
                      if (root.resolve().parent != temp or root.is_symlink() or
                              getattr(rootstat,"st_file_attributes",0) & stat.FILE_ATTRIBUTE_REPARSE_POINT):
                          return "HOLD_OWNED_SCRATCH"
                      marker = root / "intent.marker"
                      terminal = root / "terminal.marker"
                      child = None
                      try:
                          child = subprocess.Popen(
                              [sys.executable,"-B","-c",WORKER,str(marker)],
                              cwd=str(root),stdin=subprocess.DEVNULL,
                              stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,
                              creationflags=subprocess.CREATE_NEW_PROCESS_GROUP,
                          )
                          deadline=time.monotonic()+12
                          while time.monotonic()<deadline and not marker.is_file():
                              if child.poll() is not None:
                                  return "HOLD_WORKER_EARLY_EXIT"
                              time.sleep(0.05)
                          if (not marker.is_file() or marker.is_symlink() or
                                  marker.read_bytes()!=b"INTENT_ONLY" or child.poll() is not None):
                              return "HOLD_DURABLE_INTENT_UNPROVEN"
                          child.kill()
                          code=child.wait(timeout=8)
                          if code==0 or child.poll() is None:
                              return "HOLD_WORKER_KILL_UNPROVEN"
                          if terminal.exists() or terminal.is_symlink():
                              return "HOLD_TERMINAL_CONFLICT"
                          # Fresh process is a read-only observer. NEVER run WORKER twice.
                          reader=subprocess.run(
                              [sys.executable,"-B","-c",READER,str(root)],
                              cwd=str(root),stdin=subprocess.DEVNULL,
                              capture_output=True,text=True,timeout=8,check=False,
                              creationflags=subprocess.CREATE_NEW_PROCESS_GROUP,
                          )
                          if reader.returncode!=0 or reader.stdout.strip()!="HOLD_UNKNOWN_NO_REPLAY" or reader.stderr:
                              return "HOLD_FRESH_READER_UNPROVEN"
                          return "PASS_FRESH_READER_HOLD_UNKNOWN"
                      finally:
                          if child is not None and child.poll() is None:
                              child.kill()
                              child.wait(timeout=8)
              except (OSError,ValueError,subprocess.SubprocessError):
                  return "HOLD_NATIVE_OBSERVATION"
          
          if __name__=="__main__":
              try:
                  status=observe()
              except Exception:
                  status="HOLD_NATIVE_OBSERVATION"
              print("EPWO_WP01_RESTART_STATUS="+status)
              print("EPWO_WP01_RESTART_SCOPE=DISPOSABLE_PROCESS_ONLY")
              print("EPWO_WP01_RESTART_RUNNER_REBOOT=NOT_TESTED")
              print("EPWO_WP01_RESTART_PROVIDER=NOT_INVOKED")
              print("EPWO_WP01_RESTART_WORKOWNER_710=NOT_TOUCHED")
              print("EPWO_WP01_RESTART_REPLAY_AUTHORIZED=FALSE")
              print("EPWO_WP01_RESTART_OWNER_TRANSFER=NOT_AUTHORIZED")
              raise SystemExit(0 if status=="PASS_FRESH_READER_HOLD_UNKNOWN" else 2)
          '@
          & python -B -c $probe
          exit $LASTEXITCODE
