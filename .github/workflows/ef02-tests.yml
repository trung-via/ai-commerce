name: EF02 source tests
on:
  push:
    branches: [ef02-multi-action-implementation, main]
    paths:
      - "src/ai_commerce/remote/**"
      - "src/ai_commerce/engineering/**"
      - "tests/test_ef02*.py"
      - "tests/test_ef01.py"
      - ".github/workflows/ef02-tests.yml"
  pull_request:
    paths:
      - "src/ai_commerce/remote/**"
      - "src/ai_commerce/engineering/**"
      - "tests/test_ef01.py"
      - "tests/test_ef02*.py"
      - ".github/workflows/ef02-*.yml"
      - "contracts/RemoteActionBatch.v1.schema.json"
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q
