name: EF02 source tests
on:
  push:
    branches: [ef02-multi-action-implementation, main]
  pull_request:
permissions:
  contents: read
  actions: read
# Keep only the newest candidate CI run per PR; never cancel a main push.
# Exact-head gate requires new proof, not stale/cancelled workflow receipts.
concurrency:
  group: ef02-source-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: MT-01 prove postmerge exact-tree PR CI
        id: reuse
        run: python .github/scripts/ef02-pr-ci-tests.py --reuse-preflight
        env:
          MT01_CI_EVENT: ${{ github.event_name }}
          MT01_V21_ENABLED: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - name: MT-01 V2.1 scope/dependency preflight
        id: v21
        if: steps.reuse.outputs.skip_pytest != 'true'
        run: python .github/scripts/ef02-pr-ci-tests.py --v21-plan-only
        env:
          MT01_CI_EVENT: ${{ github.event_name }}
          MT01_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MT01_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: MT-01 baseline closure oracle
        if: steps.reuse.outputs.skip_pytest != 'true'
        run: python .github/scripts/mt01_v21_oracle.py --base "${{ github.event.pull_request.base.sha }}" --plan .local/mt01-v21/plan.json
      - name: Install FFmpeg on Windows hosted runner
        if: steps.v21.outputs.need_ffmpeg == 'true'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFMPEG_CHOCO_INSTALL_FAILED" }
      - name: Verify ffmpeg, ffprobe and libx264 are executable
        if: steps.v21.outputs.need_ffmpeg == 'true'
        run: python -c "import shutil,subprocess; assert shutil.which('ffmpeg') and shutil.which('ffprobe'), 'FFMPEG_OR_FFPROBE_MISSING'; assert b'libx264' in subprocess.check_output(['ffmpeg','-hide_banner','-encoders']), 'LIBX264_MISSING'; subprocess.check_call(['ffprobe','-version'],stdout=subprocess.DEVNULL)"
      - run: python -m pip install -e ".[dev]" Pillow
        if: steps.reuse.outputs.skip_pytest != 'true'
      - name: MT-01 PR CI selective tests (full fallback)
        if: steps.reuse.outputs.skip_pytest != 'true'
        run: python .github/scripts/ef02-pr-ci-tests.py
        env:
          MT01_CI_EVENT: ${{ github.event_name }}
          MT01_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MT01_CI_XDIST_WORKERS: '4'
          MT01_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: MT-01 V2.1 upload verification receipt
        if: always() && steps.reuse.outputs.skip_pytest != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mt01-v21-windows-latest-${{ github.run_id }}
          path: .local/mt01-v21/**
          if-no-files-found: error
          retention-days: 14
      - name: Exact-tree PR CI reused — stdlib smoke
        if: steps.reuse.outputs.skip_pytest == 'true'
        run: python -m compileall -q src/ai_commerce
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ef02-watch.test.cjs tests/ef02-reconcile.test.cjs
