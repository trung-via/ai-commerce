name: EF02 source tests
on:
  push:
    # Do not rerun the same tests after an already reviewed PR merge.
    branches: [ef02-multi-action-implementation]
  pull_request:
permissions:
  contents: read
  actions: read
# Keep only the newest candidate CI run per PR; never cancel a main push.
# Exact-head gate requires new proof, not stale/cancelled workflow receipts.
concurrency:
  group: ef02-source-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    name: tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout protected main for EF02 original-proof oracle
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: main
          path: .local/trusted-gate
          persist-credentials: false
      - name: Reuse genuine exact-head EF02 Windows PASS (no pytest replay)
        if: github.event_name == 'pull_request'
        id: ef02_proof
        run: python .local/trusted-gate/.github/scripts/pr-merge-gate.py --ef02-reuse-preflight
        env:
          GH_TOKEN: ${{ github.token }}
          EF02_REUSE_PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: MT-01 prove postmerge exact-tree PR CI
        id: reuse
        if: steps.ef02_proof.outputs.verified != 'true'
        run: python .github/scripts/ef02-pr-ci-tests.py --reuse-preflight
        env:
          MT01_CI_EVENT: ${{ github.event_name }}
          MT01_V21_ENABLED: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - name: MT-01 V2.1 scope/dependency preflight
        id: v21
        if: steps.ef02_proof.outputs.verified != 'true' && steps.reuse.outputs.skip_pytest != 'true'
        run: python .github/scripts/ef02-pr-ci-tests.py --v21-plan-only
        env:
          MT01_CI_EVENT: ${{ github.event_name }}
          MT01_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MT01_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: MT-01 baseline closure oracle
        if: steps.ef02_proof.outputs.verified != 'true' && steps.reuse.outputs.skip_pytest != 'true'
        run: python .github/scripts/mt01_v21_oracle.py --base "${{ github.event.pull_request.base.sha }}" --plan .local/mt01-v21/plan.json
      - name: Install FFmpeg on Windows hosted runner
        if: steps.ef02_proof.outputs.verified != 'true' && steps.v21.outputs.need_ffmpeg == 'true'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFMPEG_CHOCO_INSTALL_FAILED" }
      - name: Verify ffmpeg, ffprobe and libx264 are executable
        if: steps.ef02_proof.outputs.verified != 'true' && steps.v21.outputs.need_ffmpeg == 'true'
        run: python -c "import shutil,subprocess; assert shutil.which('ffmpeg') and shutil.which('ffprobe'), 'FFMPEG_OR_FFPROBE_MISSING'; assert b'libx264' in subprocess.check_output(['ffmpeg','-hide_banner','-encoders']), 'LIBX264_MISSING'; subprocess.check_call(['ffprobe','-version'],stdout=subprocess.DEVNULL)"
      - run: python -m pip install -e ".[dev]" Pillow
        if: steps.ef02_proof.outputs.verified != 'true' && steps.reuse.outputs.skip_pytest != 'true'
      - name: Whole-repository Windows-only policy audit
        if: steps.ef02_proof.outputs.verified != 'true' && steps.reuse.outputs.skip_pytest != 'true'
        run: python -m pytest tests/test_pr_merge_gate.py::test_repository_wide_windows_only_audit -q -s
      # MT-01 V2.1 already executes and attests the exact selected tests below.
      # The former contract preflight ran the same *entire test files* again,
      # sometimes taking 15 minutes before the official run even started.
      - name: MT-01 PR CI selective tests (full fallback)
        if: steps.ef02_proof.outputs.verified != 'true' && steps.reuse.outputs.skip_pytest != 'true'
        run: python .github/scripts/ef02-pr-ci-tests.py
        env:
          MT01_CI_EVENT: ${{ github.event_name }}
          MT01_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MT01_CI_XDIST_WORKERS: '4'
          MT01_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: MT-01 V2.1 upload verification receipt
        if: always() && steps.ef02_proof.outputs.verified != 'true' && steps.reuse.outputs.skip_pytest != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mt01-v21-windows-latest-${{ github.run_id }}
          path: .local/mt01-v21/**
          if-no-files-found: error
          retention-days: 14
      - name: Exact-tree PR CI reused — stdlib smoke
        if: steps.ef02_proof.outputs.verified != 'true' && steps.reuse.outputs.skip_pytest == 'true'
        run: python -m compileall -q src/ai_commerce
      - uses: actions/setup-node@v4
        if: steps.ef02_proof.outputs.verified != 'true'
        with:
          node-version: '22'
      - run: node --test tests/ef02-watch.test.cjs tests/ef02-reconcile.test.cjs
        if: steps.ef02_proof.outputs.verified != 'true'

  atb-native-proof:
    name: ATB-01 original inert Windows native proof (PR 940 only)
    # Separate privileged identity: never give OIDC to the normal PR test job.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 940 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/atb-897-recovered-appcontainer-job-source-20261115'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only the registered test dependencies
        run: python -m pip install -e ".[dev]" Pillow
      - name: Source-pin native opt-in (no native effects)
        shell: pwsh
        run: |
          $profile = python -c "from ai_commerce.engineering.windows_collection_sandbox import PROFILE_SHA256; print(PROFILE_SHA256)"
          if ($LASTEXITCODE -ne 0 -or $profile -notmatch '^[0-9a-f]{64}$') { throw "ATB_NATIVE_PROFILE_UNPROVEN" }
          "AI_COMMERCE_WINDOWS_NATIVE_PROOF=$profile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Execute the three actual hosted Windows inert probes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pytest tests/test_minimum_test.py::test_windows_native_inert_provider -q -rA --junitxml=.local/atb-native-proof/junit.xml
      - name: Require 3 real native observations (zero skip/failure)
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path(".local/atb-native-proof/junit.xml")
          if not path.is_file():
              raise SystemExit("ATB_NATIVE_JUNIT_MISSING")
          cases = ET.parse(path).getroot().findall(".//testcase")
          if len(cases) != 3 or any(c.find(t) is not None for c in cases for t in ("skipped", "failure", "error")):
              raise SystemExit("ATB_NATIVE_EXECUTION_NOT_PROVEN")
          seen = set()
          for case in cases:
              props = case.find("properties")
              if props is None:
                  raise SystemExit("ATB_NATIVE_RECEIPT_MISSING")
              fields = {p.get("name"): p.get("value") for p in props.findall("property")}
              if "mt01_native_receipt" not in fields:
                  raise SystemExit("ATB_NATIVE_RECEIPT_MISSING")
              receipt = json.loads(fields["mt01_native_receipt"])
              fault = receipt.get("fault")
              if fault in seen or fault not in {"none", "timeout", "assignment"}:
                  raise SystemExit("ATB_NATIVE_RECEIPT_DUPLICATE")
              seen.add(fault)
              if receipt.get("status") != ("NEGATIVE_OBSERVED" if fault == "assignment" else "OBSERVED"):
                  raise SystemExit("ATB_NATIVE_DENIAL_UNPROVEN")
              if not receipt.get("cleanup_complete") or receipt.get("orphan_count") != 0:
                  raise SystemExit("ATB_NATIVE_CLEANUP_UNPROVEN")
              if receipt.get("identity", {}).get("runner_environment") != "github-hosted":
                  raise SystemExit("ATB_NATIVE_ORIGIN_UNPROVEN")
          if seen != {"none", "timeout", "assignment"}:
              raise SystemExit("ATB_NATIVE_CASES_INCOMPLETE")
          print("ATB_NATIVE_HOSTED_WINDOWS_OBSERVED=3/3")
          '@ | python -
      - name: Preserve JUnit-only native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atb-native-proof-PR940-${{ github.run_id }}
          path: .local/atb-native-proof/junit.xml
          if-no-files-found: warn
          retention-days: 14
