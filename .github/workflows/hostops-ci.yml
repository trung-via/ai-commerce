name: AI Commerce HostOps bounded CI
on:
  pull_request:
    paths:
      - ".github/workflows/hostops-*.yml"
      - "scripts/hostops_request.py"
      - "scripts/HostOps-Diagnostics.ps1"
      - "tests/test_hostops_request.py"
      - "docs/engineering/HOSTOPS_REMOTE_POWERSHELL_V1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostops-*.yml"
      - "scripts/hostops_request.py"
      - "scripts/HostOps-Diagnostics.ps1"
      - "tests/test_hostops_request.py"

permissions:
  contents: read

jobs:
  hostops-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict request and bounded subprocess tests
        run: python -m unittest discover -s tests -p test_hostops_request.py -v
      - name: Parse fixed Windows PowerShell script (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/HostOps-Diagnostics.ps1').Path,
            [ref]$null, [ref]$errorsFound) | Out-Null
          if ($null -ne $errorsFound -and @($errorsFound).Count -gt 0) {
            throw ('HOSTOPS_POWERSHELL_PARSE_FAILED: ' + @($errorsFound).Count)
          }
          'HOSTOPS_POWERSHELL_PARSE_PASS'
      - name: Windows hosted smoke for fixed runner-only read (no self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $result = & ./scripts/HostOps-Diagnostics.ps1 -Operation runner_readonly | ConvertFrom-Json
          if ($result.operation -ne 'runner_readonly' -or $result.pwsh_major -lt 7) {
            throw 'HOSTOPS_FIXED_READONLY_SMOKE_FAILED'
          }
          'HOSTOPS_FIXED_READONLY_SMOKE_PASS'
