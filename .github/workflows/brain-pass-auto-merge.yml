name: AI Commerce Brain PASS auto-merge

# Runs trusted main source; GitHub validates an exact, authenticated Brain PASS
# receipt on the PR, exact HEAD/base, independent two-OS CI and artifacts.
# An ordinary CI PASS without Brain review does not authorize merging.
# PR review comments act only as an event-level wake after a genuine Brain
# PASS receipt has been published in the PR Conversation. Listening to
# issue_comment would create a Skipped Actions run for EVERY EF02 Issue comment.
on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["EF02 source tests"]
    types: [completed]

permissions:
  # GitHub REST PUT /pulls/{number}/merge requires Contents: write;
  # pull-requests: write alone makes protected merge gate return HTTP 403.
  # This token is used only by trusted main's exact-BRAIN-PASS merge script.
  contents: write
  actions: read
  issues: read
  pull-requests: write

concurrency:
  group: ai-commerce-brain-pass-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge-brain-pass:
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request_review' &&
       github.event.action == 'submitted' &&
       github.event.review.state == 'commented' &&
       github.event.review.user.login == github.repository_owner &&
       startsWith(github.event.review.body, 'AI_COMMERCE_BRAIN_REVIEW_PASS_V1'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned Brain PASS and exact-head independent CI before merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr-merge-gate.py
