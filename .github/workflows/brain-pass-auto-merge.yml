name: AI Commerce Brain PASS auto-merge

# Runs trusted main source; GitHub validates an exact, authenticated Brain PASS
# receipt on the PR, exact HEAD/base and either independently checked original
# EF02 Windows PASS evidence or Windows PR CI/artifacts if the candidate changed.
# An EF02/CI PASS without independent Brain review does not authorize merging.
# PR review comments act only as an event-level wake after a genuine Brain
# PASS receipt has been published in the PR Conversation. Listening to
# issue_comment would create a Skipped Actions run for EVERY EF02 Issue comment.
on:
  # A main merge must wake previously Brain-PASSED PRs whose older Windows
  # CI remains valid under the independently reviewed disjoint-drift oracle.
  # No candidate HEAD rewrite or pytest replay is required for that case.
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["EF02 source tests"]
    types: [completed]

permissions:
  # GitHub REST PUT /pulls/{number}/merge requires Contents: write;
  # pull-requests: write alone makes protected merge gate return HTTP 403.
  # This token is used only by trusted main's exact-BRAIN-PASS merge script.
  contents: write
  actions: read
  issues: read
  pull-requests: write

# GitHub concurrency retains at most one pending run per group. A repo-wide
# group silently drops older accepted PR wakes when unrelated PR CI finishes.
# Use the exact event source HEAD as the merge lane: a Brain review and the
# matching CI completion share one lane; distinct PR heads never evict each
# other. A source-less event gets its own run ID (still fail-closed by gate).
# The trusted merge script independently checks current main, PR HEAD/base,
# canonical Brain PASS and exact Windows CI before any write.
concurrency:
  group: ai-commerce-brain-pass-merge-${{ github.repository }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  merge-brain-pass:
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_review' &&
       github.event.action == 'submitted' &&
       github.event.review.state == 'commented' &&
       github.event.review.user.login == github.repository_owner &&
       startsWith(github.event.review.body, 'AI_COMMERCE_BRAIN_REVIEW_PASS_V1'))
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned Brain PASS and reusable EF02 or exact-head CI before merge
        env:
          GH_TOKEN: ${{ github.token }}
          EF02_PROOF_TRACE: '1'
        run: python .github/scripts/pr-merge-gate.py
