name: EF02 M0-R actual Codex provider interruption (one-shot)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-provider-interruption:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    permissions:
      contents: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install only local project
        shell: pwsh
        run: python -m pip install -e .
      - name: One newly claimed Codex 6.1 Sol max provider interruption
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          python .github/scripts/ef02-m0r-codex-provider-interruption.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original no-replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ef02-m0r-codex-provider-${{ github.run_id }}
          path: .local/ef02-m0r/**
          if-no-files-found: warn
          retention-days: 14
