name: A08 offline assisted distribution and receipts
on:
  pull_request:
    paths:
      - "src/ai_commerce/distribution/**"
      - "src/ai_commerce/cli.py"
      - "tests/test_a08_distribution.py"
      - ".github/workflows/a08-distribution.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-a08:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFMPEG_INSTALL_FAILED" }
      - run: python -m pip install -e ".[dev]"
      - name: A08, A07, A06 and CLI minimum affected tests
        run: python -m pytest tests/test_a08_distribution.py tests/test_a07_capability.py tests/test_a06_e01.py tests/test_cli.py -q
