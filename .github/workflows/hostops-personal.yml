name: AI Commerce HostOps Personal (existing Windows runner)
on:
  workflow_call:

permissions:
  contents: read

jobs:
  personal:
    if: >-
      github.event.repository.full_name == 'trung-via/ai-commerce' &&
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issues' &&
         github.event.action == 'opened' &&
         github.event.issue.user.login == github.repository_owner &&
         startsWith(github.event.issue.title, '[HOSTOPS READ] ')) ||
        (github.event_name == 'issue_comment' &&
         github.event.action == 'created' &&
         github.event.issue.user.login == github.repository_owner &&
         github.event.comment.user.login == github.repository_owner &&
         startsWith(github.event.issue.title, '[HOSTOPS WRITE] ') &&
         github.event.comment.body == format('APPROVE WRITE #{0}', github.event.issue.number))
      )
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: personal-hostops-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Execute fixed bounded personal operation
        shell: pwsh
        env:
          HOSTOPS_PERSONAL_MODE: ${{ github.event_name == 'issues' && 'read' || 'write' }}
        run: |
          python scripts/hostops_personal.py --mode "$env:HOSTOPS_PERSONAL_MODE" --output "$env:RUNNER_TEMP\personal-hostops-result.json"
          exit $LASTEXITCODE
      - name: Post sanitized result to same Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const file = path.join(process.env.RUNNER_TEMP, 'personal-hostops-result.json');
            let record = {status:'BLOCKED',code:'NO_NATIVE_RECEIPT'};
            if (fs.existsSync(file)) {
              try { record = JSON.parse(fs.readFileSync(file,'utf8')); }
              catch (_) { record = {status:'BLOCKED',code:'INVALID_NATIVE_RECEIPT'}; }
            }
            const publicFields = ['status','code','operation','issue_number','root_id','relative_path','bytes','sha256','windows','architecture','logical_cpu_count','no_shell_command_executed','overwritten','remote_shell_enabled','source_sha','approval_channel','content_utf8'];
            const sanitized = {};
            for (const key of publicFields) {
              if (Object.prototype.hasOwnProperty.call(record,key)) sanitized[key] = record[key];
            }
            if (typeof sanitized.content_utf8 === 'string' && sanitized.content_utf8.length > 8192)
              delete sanitized.content_utf8;
            const result = 'AI_COMMERCE_PERSONAL_HOSTOPS_RESULT_V1\n' + JSON.stringify(sanitized);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: result,
            });
