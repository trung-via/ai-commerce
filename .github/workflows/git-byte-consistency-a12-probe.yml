name: "Git Byte Consistency A12-02 self-hosted Windows evidence probe"
on:
  push:
    branches:
      - probe/a12-byte-consistency-general-json-20261030
    paths:
      - .github/workflows/git-byte-consistency-a12-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Windows, ai-commerce-ef02]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact A12-02 verified source with generic JSON byte policy
        shell: pwsh
        run: |
          ./scripts/EF02-A12-Worktree-Preflight.ps1 -SourceSha ${{ github.sha }}
