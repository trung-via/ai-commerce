[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-commerce"
version = "0.1.0"
description = "Independent AI Commerce application foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.22,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-xdist>=3.6,<4"]
parallel-tests = ["pytest>=8,<10", "pytest-xdist>=3.6,<4"]

[project.scripts]
ai-commerce = "ai_commerce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_commerce.contracts" = ["schemas/*.schema.json"]
"ai_commerce.distribution" = ["schemas/*.schema.json", "profiles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
